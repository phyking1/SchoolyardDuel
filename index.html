      toGYSelf(); break;
    }
    case 'destroy_1_spelltrap': case 'dust_tornado': {
      const opts=[]; [ME,BOT].forEach(s=>{ G.players[s].st.forEach((c,i)=>{ if(c && c.uid!==card.uid) opts.push({s,i,c}); }); });
      const doIt=(o)=>{
        const wasFD=o.c.faceDown;
        const srcEl=zoneCardEl(pIdx,'st',idx), targetEl=zoneCardEl(o.s,'st',o.i);
        playBeamThenRun(srcEl,[targetEl],()=>{
          sendToGY(o.s,o.c,'st',o.i,'effect');
          if(fx==='dust_tornado'&&wasFD) drawCard(pIdx);
          render();
        });
        log(`${base(card).n} destroys ${wasFD?'a Set card':base(o.c).n}.`,pIdx===ME?'me':'opp');
      };
      if(opts.length){ if(pIdx===ME) showModal(base(card).n,'Choose a Spell/Trap to destroy:',opts.map(o=>({label:(o.s===ME?'Your ':"Bot's ")+(o.c.faceDown?'Set Card':base(o.c).n),action:()=>doIt(o)}))); else doIt(opts.find(o=>o.s===ME)||opts[0]); }
      toGYSelf(); break;
    }
    case 'cosmic_cyclone': {
      if(G.health[pIdx]<=1000){ toast('Not enough Health.'); G.players[pIdx].st[idx]=null; break; }
      const opts=[]; [ME,BOT].forEach(s=>{ G.players[s].st.forEach((c,i)=>{ if(c && c.uid!==card.uid) opts.push({s,i,c}); }); });
      const doIt=(o)=>{ G.health[pIdx]-=1000; banish(o.s,o.c,'st',o.i); log(`${base(card).n} banishes a Spell/Trap.`,pIdx===ME?'me':'opp'); render(); };
      if(opts.length){ if(pIdx===ME) showModal('Cosmic Cyclone','Choose a Spell/Trap to banish (pay 1000 Health):',opts.map(o=>({label:(o.s===ME?'Your ':"Bot's ")+(o.c.faceDown?'Set Card':base(o.c).n),action:()=>doIt(o)}))); else doIt(opts[0]); }
      toGYSelf(); break;
    }
    case 'change_of_heart': {
      const opts=[]; G.players[opp].mon.forEach((m,i)=>{ if(m) opts.push(i); });
      const doIt=(i)=>{
        const m=G.players[opp].mon[i];
        const canRespond=base(m).fx==='turtle_tiger' && m.usedEffectTurn!==G.turnNum && G.health[opp]>1000;
        const proceedSwap=()=>{
          G.players[opp].mon[i]=null; const z=findEmptyZone(pIdx,'mon'); if(z<0){toast('No empty zone.');return;}
          m.controller=pIdx; m.zone=z; m.tempEndPhaseReturn={owner:opp,ownIdx:i}; G.players[pIdx].mon[z]=m;
          log(`${pIdx===ME?'You':'Bot'} takes control of ${base(m).n}.`,pIdx===ME?'me':'opp'); render();
        };
        if(!canRespond){ proceedSwap(); return; }
        const negate=()=>{
          m.usedEffectTurn=G.turnNum;
          G.health[opp]-=1000;
          log(`${opp===ME?'You pay':'Bot pays'} 1000 Health — Turtle Tiger negates Change of Heart!`, opp===ME?'me':'opp');
          render();
        };
        if(opp===ME) showModal('Turtle Tiger','Pay 1000 Health to negate Change of Heart and destroy it?',[
          {label:'Pay 1000 Health',action:negate},
          {label:'Allow it',action:proceedSwap},
        ]);
        else negate();
      };
      if(opts.length){ if(pIdx===ME) showModal('Change of Heart','Take control of which monster?',opts.map(i=>({label:base(G.players[opp].mon[i]).n,action:()=>doIt(i)}))); else doIt(opts[0]); }
      toGYSelf(); break;
    }
    case 'creature_swap': {
      const myOpts=allOwnedMonsters(pIdx), oppOpts=allOwnedMonsters(opp);
      if(myOpts.length && oppOpts.length){
        const mi=myOpts[0], oi=oppOpts[0];
        const a=G.players[pIdx].mon[mi], b=G.players[opp].mon[oi];
        G.players[pIdx].mon[mi]=b; b.controller=pIdx; b.zone=mi;
        G.players[opp].mon[oi]=a; a.controller=opp; a.zone=oi;
        log('Creature Swap: monsters exchanged.','sys'); render();
      }
      toGYSelf(); break;
    }
    case 'white_elephants_gift': {
      const myOpts=allOwnedMonsters(pIdx), oppOpts=allOwnedMonsters(opp);
      if(myOpts.length && oppOpts.length){
        const mi=myOpts[0], oi=oppOpts[0];
        const a=G.players[pIdx].mon[mi], b=G.players[opp].mon[oi];
        G.players[pIdx].mon[mi]=b; b.controller=pIdx; b.zone=mi; b.tempAtk=(b.tempAtk||0)+300;
        G.players[opp].mon[oi]=a; a.controller=opp; a.zone=oi; a.tempAtk=(a.tempAtk||0)+300;
        log("White Elephant's Gift: monsters swapped, each gains 300 ATK/DEF.",'sys'); render();
      }
      toGYSelf(); break;
    }
    case 'zero_gravity': [ME,BOT].forEach(s=>{ G.players[s].mon.forEach(m=>{ if(m && !m.faceDown) m.pos=m.pos==='atk'?'def':'atk'; }); }); log('Zero Gravity flips all battle positions.','sys'); render(); toGYSelf(); break;
    case 'reverse_glasses': [ME,BOT].forEach(s=>{ G.players[s].mon.forEach(m=>{ if(m && !m.faceDown && m.pos==='def') m.reverseGlasses=true; }); }); log('Reverse Glasses swaps ATK/DEF of face-up Defense Position monsters this turn.','sys'); render(); toGYSelf(); break;
    case 'rush_recklessly': {
      const opts=allOwnedMonsters(pIdx);
      const doIt=(i)=>{ G.players[pIdx].mon[i].tempAtk=(G.players[pIdx].mon[i].tempAtk||0)+700; log('Rush Recklessly: +700 ATK.',pIdx===ME?'me':'opp'); render(); };
      if(opts.length){ if(pIdx===ME) showModal('Rush Recklessly','Choose a monster to gain 700 ATK:',opts.map(i=>({label:base(G.players[pIdx].mon[i]).n,action:()=>doIt(i)}))); else doIt(opts[0]); }
      toGYSelf(); break;
    }
    case 'jar_of_avarice': {
      const mons=G.gy.filter(c=>isMonster(c)).slice(0,5);
      mons.forEach(c=>{ G.gy=G.gy.filter(x=>x.uid!==c.uid); G.deck.push(c); });
      shuffle(G.deck); drawCard(pIdx); toGYSelf(); break;
    }
    case 'pot_of_duality': {
      const top=G.deck.slice(-3);
      const pick=(c)=>{ G.deck=G.deck.filter(x=>x.uid!==c.uid); G.players[pIdx].hand.push(c); shuffle(G.deck); render(); };
      if(top.length){ if(pIdx===ME) showModal('Pot of Duality','Add 1 of the top 3 cards to your hand:',top.map(c=>({label:base(c).n,action:()=>pick(c)}))); else pick(top[0]); }
      toGYSelf(); break;
    }
    case 'trap_stun': G.trapStunTurn=G.turnNum+'_'+G.active; log('Trap Stun negates all face-up Trap effects this turn.','sys'); toGYSelf(); break;
    case 'time_seal': G.skipDraw=opp; log(`${opp===ME?'Your':"Bot's"} next Draw Phase will be skipped.`,'sys'); toGYSelf(); break;
    case 'enchanting_fitting_room': /* continuous, stays on field */ break;
    case 'call_of_the_haunted': {
      const opts=G.gy.filter(c=>isMonster(c));
      const place=(c)=>{
        const z=findEmptyZone(pIdx,'mon'); if(z<0){toast('No empty Monster Zone.');return;}
        G.gy=G.gy.filter(x=>x.uid!==c.uid);
        Object.assign(c,{faceDown:false,pos:'atk',controller:pIdx,zone:z,summonedTurn:G.turnNum,attacked:false,tempAtk:0,equips:[],linkedContinuous:card.uid});
        G.players[pIdx].mon[z]=c;
        log(`${pIdx===ME?'You':'Bot'} Special Summons ${base(c).n} with Call of the Haunted.`,pIdx===ME?'me':'opp');
        render();
        afterAnySummon(pIdx,c,z,false,true);
      };
      if(opts.length){ if(pIdx===ME) showModal('Call of the Haunted','Special Summon a monster from the Graveyard:',opts.map(c=>({label:base(c).n,action:()=>place(c)}))); else place(opts[opts.length-1]); }
      /* continuous: stays face-up on the field, not sent to GY */
      break;
    }
    case 'amulet_of_ambition': case 'axe_of_fools': case 'horn_of_unicorn': {
      const opts=allOwnedMonsters(pIdx);
      const doIt=(i)=>{
        const m=G.players[pIdx].mon[i];
        m.equips.push(fx);
        card.equippedSide=pIdx; card.equippedIdx=i;
        log(`${base(card).n} equips to ${base(m).n}.`, pIdx===ME?'me':'opp');
        render();
      };
      if(opts.length){ if(pIdx===ME) showModal(base(card).n,'Equip to which of your monsters?',opts.map(i=>({label:base(G.players[pIdx].mon[i]).n,action:()=>doIt(i)}))); else doIt(opts[0]); }
      else { toast('No monster to equip.'); toGYSelf(); }
      /* stays on field face-up as an Equip Spell; not sent to GY here */
      break;
    }
    case 'blast_with_chain': {
      const opts=allOwnedMonsters(opp);
      const doIt=(i)=>{ G.players[opp].mon[i].blastChained=true; log(`Blast with Chain is equipped to ${base(G.players[opp].mon[i]).n}. If it's destroyed, its controller takes 500 damage.`,pIdx===ME?'me':'opp'); render(); };
      if(opts.length){ if(pIdx===ME) showModal('Blast with Chain','Equip to which of your opponent\'s monsters?',opts.map(i=>({label:base(G.players[opp].mon[i]).n,action:()=>doIt(i)}))); else doIt(opts[0]); }
      else { toast('No valid monster to equip.'); toGYSelf(); }
      /* continuous: stays face-up on the field, not sent to GY */
      break;
    }
    case 'trap_hole': case 'torrential_tribute': case 'floodgate_trap_hole': case 'michizure':
    case 'magic_cylinder': case 'draining_shield': case 'dimensional_prison': case 'waboku':
    case 'solemn_judgment': case 'dark_bribe': case 'horn_of_heaven':
      /* these Counter/response Traps only resolve via their specific trigger windows;
         manual activation is blocked in the UI, so this branch should be unreachable */
      break;
    default: break;
  }
  render();
  checkWin();
}


/* ============================= MODAL / TOAST ============================= */
function showModal(title,body,opts){
  const bg=document.createElement('div'); bg.className='modal-bg';
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<h3>${title}</h3><p class="hint">${body}</p>`;
  const row=document.createElement('div'); row.className='mrow';
  opts.forEach(o=>{
    const d=document.createElement('div'); d.className='mopt';
    const label=document.createElement('span'); label.className='mopt-label'; label.textContent=o.label;
    d.appendChild(label);
    if(o.card){
      const peek=document.createElement('button'); peek.className='mopt-peek'; peek.type='button';
      peek.textContent='👁'; peek.title='View card';
      peek.addEventListener('click',(e)=>{ e.stopPropagation(); showCardPopup(o.card,false); });
      d.appendChild(peek);
    }
    d.addEventListener('click',(e)=>{ e.stopPropagation(); document.body.removeChild(bg); o.action(); });
    row.appendChild(d);
  });
  m.appendChild(row); bg.appendChild(m); document.body.appendChild(bg);
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',2200);
}

/* ============================= CARD BROWSER (deck list / graveyard) ============================= */
function allCardDefs(){ return [...MONSTER_DB,...SPELLTRAP_DB]; }
function defsFromInstances(cards){ return cards.map(c=>base(c)); }
function previewInstance(def){ return {baseId:def.id, zone:-1}; }
function sortedByName(defs){ return defs.slice().sort((a,b)=>a.n.localeCompare(b.n)); }

function closeOnBgClick(bg){
  bg.addEventListener('click',(e)=>{ if(e.target===bg) document.body.removeChild(bg); });
}

function openCardBrowser(title,defs){
  const monsters=sortedByName(defs.filter(d=>d.cat==='Monster'));
  const spelltraps=sortedByName(defs.filter(d=>d.cat!=='Monster'));
  const opts=[];
  if(monsters.length) opts.push({label:`See All Monsters (${monsters.length})`,action:()=>showCardTextList(title+' · Monsters',monsters)});
  if(spelltraps.length) opts.push({label:`See All Spells/Traps (${spelltraps.length})`,action:()=>showCardTextList(title+' · Spells/Traps',spelltraps)});
  if(defs.length) opts.push({label:'View Cards',action:()=>openCardCarousel(title,sortedByName(defs))});
  opts.push({label:'Close',action:()=>{}});
  showModal(title, defs.length?`${defs.length} card${defs.length===1?'':'s'}.`:'Empty.', opts);
}

function showCardTextList(title,defs){
  const bg=document.createElement('div'); bg.className='modal-bg';
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<h3>${title}</h3><p class="hint">${defs.length} card${defs.length===1?'':'s'}. Tap a card to view it.</p>`;
  const list=document.createElement('div'); list.className='card-list-rows';
  defs.forEach(d=>{
    const row=document.createElement('div'); row.className='card-list-row';
    const icon=document.createElement('span'); icon.className='clr-icon'; icon.textContent=d.em;
    const name=document.createElement('span'); name.className='clr-name'; name.textContent=d.n;
    const tag=document.createElement('span'); tag.className='clr-tag';
    tag.textContent = d.cat==='Monster' ? `Lv${d.l} ${d.atk}/${d.def}` : `${d.sub} ${d.cat}`;
    row.append(icon,name,tag);
    row.addEventListener('click',(e)=>{ e.stopPropagation(); showCardPopup(previewInstance(d),false); });
    list.appendChild(row);
  });
  m.appendChild(list);
  const closeRow=document.createElement('div'); closeRow.className='mrow';
  const closeBtn=document.createElement('div'); closeBtn.className='mopt';
  closeBtn.innerHTML='<span class="mopt-label">Close</span>';
  closeBtn.addEventListener('click',()=>document.body.removeChild(bg));
  closeRow.appendChild(closeBtn);
  m.appendChild(closeRow);
  bg.appendChild(m); document.body.appendChild(bg);
  closeOnBgClick(bg);
}

function openCardCarousel(title,defs){
  if(!defs.length) return;
  let idx=0;
  const bg=document.createElement('div'); bg.className='modal-bg';
  const m=document.createElement('div'); m.className='modal carousel-modal';
  const head=document.createElement('h3'); head.textContent=title;
  const counter=document.createElement('p'); counter.className='hint';
  const cardWrap=document.createElement('div'); cardWrap.className='carousel-card-wrap';
  const navRow=document.createElement('div'); navRow.className='mrow';
  const prevBtn=document.createElement('div'); prevBtn.className='mopt';
  prevBtn.innerHTML='<span class="mopt-label">◀ Prev</span>';
  const nextBtn=document.createElement('div'); nextBtn.className='mopt';
  nextBtn.innerHTML='<span class="mopt-label">Next ▶</span>';
  const closeRow=document.createElement('div'); closeRow.className='mrow';
  const closeBtn=document.createElement('div'); closeBtn.className='mopt';
  closeBtn.innerHTML='<span class="mopt-label">Close</span>';
  function renderCurrent(){
    const d=defs[idx];
    counter.textContent=`${idx+1} / ${defs.length} — ${d.cat}`;
    cardWrap.innerHTML='';
    cardWrap.appendChild(buildZoomCard(previewInstance(d),false));
  }
  function close(){
    document.removeEventListener('keydown',onKey);
    if(bg.parentNode) document.body.removeChild(bg);
  }
  function onKey(e){
    if(e.key==='ArrowLeft'){ idx=(idx-1+defs.length)%defs.length; renderCurrent(); }
    else if(e.key==='ArrowRight'){ idx=(idx+1)%defs.length; renderCurrent(); }
    else if(e.key==='Escape'){ close(); }
  }
  prevBtn.addEventListener('click',()=>{ idx=(idx-1+defs.length)%defs.length; renderCurrent(); });
  nextBtn.addEventListener('click',()=>{ idx=(idx+1)%defs.length; renderCurrent(); });
  closeBtn.addEventListener('click',close);
  navRow.append(prevBtn,nextBtn);
  closeRow.appendChild(closeBtn);
  m.append(head,counter,cardWrap,navRow,closeRow);
  bg.appendChild(m); document.body.appendChild(bg);
  bg.addEventListener('click',(e)=>{ if(e.target===bg) close(); });
  document.addEventListener('keydown',onKey);
  renderCurrent();
}

document.getElementById('decklist-btn').addEventListener('click',()=>{
  openCardBrowser('Deck List ('+allCardDefs().length+')', allCardDefs());
});

/* ============================= BOT AI ============================= */
function botMainPhase(){
  setTimeout(()=>botStep1(),700);
}
function botStep1(){
  const p=G.players[BOT];
  const lgIdx=p.hand.findIndex(c=>base(c).fx==='lava_golem');
  if(lgIdx>=0 && allOwnedMonsters(ME).length>=2){
    const card=p.hand[lgIdx];
    const tribs=allOwnedMonsters(ME).slice(0,2);
    tribs.sort((a,b2)=>b2-a).forEach(i=>{ const t=G.players[ME].mon[i]; sendToGY(ME,t,'mon',i,'tribute'); });
    p.hand.splice(lgIdx,1);
    const z=findEmptyZone(ME,'mon');
    card.faceDown=false; card.pos='atk'; card.controller=ME; card.zone=z;
    card.summonedTurn=G.turnNum; card.attacked=false; card.equips=[]; card.tempAtk=0;
    G.players[ME].mon[z]=card;
    log(`Bot Special Summons Lava Golem to your field!`,'opp');
    SFX.place(); markJustPlaced(card.uid);
    render();
    afterAnySummon(ME,card,z,false,true);
  }
  // Play a monster if possible
  if(!p.normalSummonUsed){
    const idx=p.hand.findIndex(c=>isMonster(c) && base(c).fx!=='lava_golem');
    if(idx>=0){
      const card=p.hand[idx];
      const b=base(card);
      const need=b.l>=7?2:(b.l>=5?1:0);
      const owned=allOwnedMonsters(BOT);
      if(need<=owned.length){
        const z=findEmptyZone(BOT,'mon');
        if(z>=0){
          const tribs=owned.slice(0,need);
          tribs.sort((a,b2)=>b2-a).forEach(i=>{ const t=p.mon[i]; sendToGY(BOT,t,'mon',i,'tribute'); });
          p.hand.splice(idx,1);
          const setFaceDown = b.atk<1200 && b.def>=1500;
          card.faceDown=setFaceDown; card.pos=setFaceDown?'def':'atk'; card.controller=BOT; card.zone=z;
          card.summonedTurn=G.turnNum; card.attacked=false; card.equips=[]; card.tempAtk=0;
          p.mon[z]=card; p.normalSummonUsed=true;
          log(`Bot ${setFaceDown?'Sets':'Summons'} a monster in ${setFaceDown?'Defense':'Attack'} Position.`,'opp');
          SFX.place(); markJustPlaced(card.uid);
          render();
          if(!setFaceDown) afterSummon(BOT,card,z); else afterAnySummon(BOT,card,z,true);
        }
      }
    }
  }
  setTimeout(()=>botUseMonsterEffects(),700);
}
function botUseMonsterEffects(){
  const p=G.players[BOT];
  p.mon.forEach((m,i)=>{
    if(!m || m.faceDown) return;
    const eff=getActivatableMonsterEffect(m,BOT,i);
    if(eff) eff.activate();
  });
  setTimeout(()=>botStep2(),700);
}
function botStep2(){
  // Play spells: destructive/advantage ones now, set traps
  const p=G.players[BOT];
  let played=true, guard=0;
  function tryOne(){
    guard++; if(guard>6) { setTimeout(finishMain,600); return; }
    const idx=p.hand.findIndex(c=>!isMonster(c));
    if(idx<0){ finishMain(); return; }
    const card=p.hand[idx]; const b=base(card);
    const z=findEmptyZone(BOT,'st');
    if(z<0){ finishMain(); return; }
    if(b.cat==='Trap'){
      p.hand.splice(idx,1); card.faceDown=true; card.controller=BOT; card.zone=z; card.summonedTurn=G.turnNum;
      p.st[z]=card; log('Bot Sets a card.','opp'); SFX.place(); markJustPlaced(card.uid); render();
      setTimeout(tryOne,500);
    } else {
      const goodNow=['raigeki','dark_hole','fissure','feather_duster','destroy_all_spelltrap','pot_of_greed','monster_reborn','just_desserts'].includes(b.fx);
      const worthwhile = goodNow && (b.fx!=='raigeki'&&b.fx!=='fissure'&&b.fx!=='just_desserts' ? true : G.players[ME].mon.some(m=>m));
      if(worthwhile){
        p.hand.splice(idx,1); card.faceDown=false; card.controller=BOT; card.zone=z; card.summonedTurn=G.turnNum;
        p.st[z]=card; log(`Bot activates ${b.n}.`,'opp'); SFX.activate(); markJustPlaced(card.uid); render();
        resolveSpellTrapEffect(BOT,card,z);
        setTimeout(tryOne,700);
      } else if(b.sub==='Equip'){
        finishMain();
      } else {
        p.hand.splice(idx,1); card.faceDown=true; card.controller=BOT; card.zone=z; card.summonedTurn=G.turnNum;
        p.st[z]=card; log('Bot Sets a card.','opp'); SFX.place(); markJustPlaced(card.uid); render();
        setTimeout(tryOne,500);
      }
    }
  }
  tryOne();
}
function finishMain(){
  if(G.phase==='main1'){ advancePhase(); }
  else if(G.phase==='main2'){ advancePhase(); }
}
function botBattlePhase(){
  setTimeout(()=>botAttackStep(0),700);
}
function botAttackStep(fromIdx){
  const p=G.players[BOT];
  for(let i=fromIdx;i<4;i++){
    const m=p.mon[i];
    if(m && !m.faceDown && m.pos==='atk' && !m.attacked){
      const myMons=allOwnedMonsters(ME);
      let targetIdx=-1;
      if(myMons.length){
        // attack weakest defender it can beat, else strongest attacker if it wins, else skip
        let best=-1,bestScore=-Infinity;
        myMons.forEach(ti=>{
          const t=G.players[ME].mon[ti];
          const tStrength = t.pos==='atk'? effAtk(t) : effDef(t);
          const score = effAtk(m)-tStrength;
          if(score>bestScore){bestScore=score; best=ti;}
        });
        if(bestScore>=0) targetIdx=best; else { botAttackStep(i+1); return; }
      }
      m.attacked=true;
      log(`Bot attacks with ${base(m).n}${targetIdx===-1?' directly!':'.'}`,'opp');
      render();
      openAttackTrapWindow(BOT,ME,m,i,targetIdx,(cancelled)=>{
        if(cancelled){ setTimeout(()=>botAttackStep(i+1),700); return; }
        playClashAnimation(BOT,ME,i,targetIdx,()=>{
          performBattle(BOT,ME,i,targetIdx);
          setTimeout(()=>botAttackStep(i+1),700);
        });
      });
      return;
    }
  }
  setTimeout(()=>advancePhase(),500);
}

/* ============================= END PHASE CLEANUP ============================= */
const origDoEndPhase=doEndPhase;
doEndPhase=function(){
  [ME,BOT].forEach(s=>{
    G.players[s].mon.forEach(m=>{ if(m){ if(m.reverseGlasses) m.reverseGlasses=false; if(m.unaffectedByEffects) m.unaffectedByEffects=false; if(m.tempEndPhaseReturn){ const t=m.tempEndPhaseReturn; const zi=G.players[s].mon.indexOf(m); G.players[s].mon[zi]=null; m.controller=t.owner; m.zone=t.ownIdx; if(!G.players[t.owner].mon[t.ownIdx]) G.players[t.owner].mon[t.ownIdx]=m; delete m.tempEndPhaseReturn; } } });
  });
  G.waboku=null;
  G.noBattleDamage=[false,false];
  if(G.skipDraw!==undefined && G.skipDraw!==null){ /* handled in doDrawPhase via consumption below */ }
  origDoEndPhase();
};
const origDoDrawPhase=doDrawPhase;
doDrawPhase=function(){
  if(!isVeryFirstTurn() && G.skipDraw===G.active){
    log(`${G.active===ME?'You':'Bot'} skip the Draw Phase (Time Seal).`,'sys');
    G.skipDraw=null;
    setTimeout(advancePhase, G.active===BOT?500:0);
    return;
  }
  origDoDrawPhase();
};
