<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schoolyard Duel</title>
<style>
:root{
  --felt:#0b3d24; --felt2:#0f4d2e; --gold:#d9b45a; --gold-dim:#8a723a;
  --ink:#f2ead6; --dim:#a9b8ac; --zone:#123f28; --zone-border:#2a6b45;
  --spellzone:#123244; --spellzone-border:#2a5a7a;
  --panel:#0d1712; --panel2:#122019; --danger:#c0483f; --good:#4a9d5f;
  --mon-normal:#e8c15a; --mon-effect:#e08a3c; --mon-flip:#c9722f;
  --spell:#3fae6a; --trap:#c94f7c; --back:#2a3f6b; --turnglow:#c9a3f7;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;background:#050a07;color:var(--ink);
  font-family:'Segoe UI',Verdana,Arial,sans-serif;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px;}

/* ---------- START SCREEN ---------- */
#start-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(circle at 50% 20%,#164a2c,#050a07 70%);
  gap:22px;z-index:50;text-align:center;padding:20px;}
.logo-img{width:min(90vw,560px);height:auto;filter:drop-shadow(0 6px 24px rgba(0,0,0,.65));}
#start-screen p.sub{color:var(--dim);margin:-10px 0 10px;max-width:520px;}
.health-choice{display:flex;gap:16px;}
.health-btn{background:var(--panel2);border:2px solid var(--gold-dim);color:var(--ink);
  padding:16px 28px;border-radius:10px;font-size:1.15em;min-width:150px;transition:.15s;}
.health-btn:hover{border-color:var(--gold);transform:translateY(-2px);}
.health-btn.sel{border-color:var(--gold);background:#1c2c1e;box-shadow:0 0 14px rgba(217,180,90,.35);}
#start-btn{background:linear-gradient(180deg,var(--gold),#a9853c);color:#1a1205;border:none;
  padding:14px 40px;border-radius:8px;font-size:1.2em;font-weight:700;letter-spacing:1px;
  box-shadow:0 4px 0 #6b551f;}
#start-btn:disabled{opacity:.4;cursor:not-allowed;}
#start-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b551f;}
#coin-flip-wrap{display:none;flex-direction:column;align-items:center;gap:14px;}
.die1{width:70px;height:70px;border-radius:14px;background:linear-gradient(160deg,#fff,#c9c9c9);
  color:#111;font-size:2em;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.5);}
.die1.spin{animation:diespin .9s ease-out;}
@keyframes diespin{0%{transform:rotate(0)}70%{transform:rotate(720deg)}100%{transform:rotate(1080deg)}}
#version-tag{position:absolute;left:0;right:0;bottom:8px;text-align:center;
  font-size:.68em;color:var(--dim);opacity:.6;pointer-events:none;}
#recache-btn{display:block;margin:14px auto 0;
  background:#16281c;border:1px solid var(--gold-dim);color:var(--dim);
  font-size:.72em;padding:5px 14px;border-radius:14px;white-space:nowrap;}
#recache-btn:hover{border-color:var(--gold);color:var(--ink);}
#recache-btn:disabled{opacity:.6;}

/* ---------- BOARD ---------- */
#game-root{display:none;position:relative;min-height:100vh;min-height:100dvh;background:
  radial-gradient(ellipse 100% 60% at 50% 0%,rgba(139,0,0,.65),transparent 60%),
  radial-gradient(ellipse 100% 60% at 50% 100%,rgba(0,102,255,.6),transparent 60%),
  #030304;
  flex-direction:column;align-items:stretch;
  justify-content:center;justify-content:safe center;}
#board-wrap{position:relative;display:flex;margin:auto 0;}
#board{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  padding:4px 6px;gap:clamp(2px,.8vw,8px);min-width:0;}

/* health rails: dock health bars to the left/right edges instead of full-width rows */
.hp-rail{flex:0 0 auto;width:clamp(30px,8vw,52px);display:flex;flex-direction:column;
  align-items:center;padding:6px 2px;gap:4px;}
.hp-rail-name{font-size:clamp(.55em,1.8vw,.75em);font-weight:800;color:var(--gold);
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.hp-rail-bar-wrap{flex:1;width:clamp(10px,3vw,16px);min-height:60px;background:#1c1c1c;
  border-radius:7px;border:1px solid #333;display:flex;flex-direction:column;
  justify-content:flex-end;overflow:hidden;}
.hp-rail-bar{width:100%;background:linear-gradient(180deg,#4a9d5f,#e8c15a,#e04a3c);
  transition:height .5s ease;}
.hp-rail-num{font-size:clamp(.6em,1.9vw,.78em);font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--ink);text-align:center;white-space:nowrap;}
.hp-rail-extra{font-size:clamp(.52em,1.6vw,.68em);color:var(--dim);background:#10241a;
  border:1px solid #234;padding:1px 4px;border-radius:4px;white-space:nowrap;}

.zone-row{display:flex;justify-content:center;gap:clamp(4px,1.6vw,8px);flex:0 0 auto;padding:2px 0;}
.zone{width:clamp(38px,13vw,64px);height:clamp(61px,20vw,98px);border-radius:6px;position:relative;
  display:flex;align-items:center;justify-content:center;transition:box-shadow .15s;flex-shrink:0;}
.zone.mon{background:var(--zone);border:2px dashed var(--zone-border);}
.zone.mon[data-side="1"]{background:#2a1013;border-color:#8a2a35;}
.zone.mon[data-side="0"]{background:#0d1a2a;border-color:#2a6bb0;}
.zone.st{background:var(--spellzone);border:2px dashed var(--spellzone-border);}
.zone.targetable{box-shadow:0 0 0 3px var(--danger),0 0 14px var(--danger);cursor:crosshair;}
.zone.placeable{box-shadow:0 0 0 3px var(--gold),0 0 14px rgba(217,180,90,.6);cursor:pointer;}

.hand-row{display:flex;justify-content:center;gap:clamp(3px,1.2vw,6px);flex:0 0 auto;padding:4px 0;
  min-height:clamp(66px,18.4vw,106px);align-items:flex-end;flex-wrap:wrap;}
.hand-row.opp{min-height:clamp(44px,12.6vw,70px);align-items:flex-start;}
.hand-row.active-turn .card{box-shadow:0 0 0 2px var(--turnglow),0 0 10px 2px var(--turnglow);}

.center-row{display:flex;align-items:center;justify-content:center;gap:clamp(6px,3vw,22px);
  flex:0 0 auto;min-height:0;flex-wrap:wrap;padding:2px 0;}
.pile{width:clamp(30px,8vw,50px);height:clamp(42px,11.2vw,70px);border-radius:6px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;font-size:.68em;color:var(--dim);
  cursor:pointer;border:2px solid #2a3f6b;background:linear-gradient(160deg,#1c2c50,#101a30);
  position:relative;}
.pile.gy{border-color:#4a2a3f;background:linear-gradient(160deg,#2c1c26,#1a1013);}
.pile .pile-label{font-weight:700;color:var(--ink);font-size:1.05em;}
.center-info{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:180px;
  max-width:100%;position:relative;}
#turn-banner{font-size:clamp(.68em,2.6vw,.95em);font-weight:800;letter-spacing:.5px;color:var(--gold);
  text-shadow:0 0 8px rgba(0,0,0,.6);text-align:center;}
#phase-track{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.phase-pip{font-size:.6em;padding:3px 6px;border-radius:10px;background:#132318;color:var(--dim);
  border:1px solid #234;}
.phase-pip.active{background:var(--gold);color:#1a1205;font-weight:700;}
#mod-chip{font-size:clamp(.6em,2vw,.78em);font-weight:700;color:var(--ink);background:#16281c;
  border:1px solid var(--gold-dim);border-radius:12px;padding:2px 10px;display:none;
  white-space:nowrap;}
#mod-chip.show{display:block;}
#action-buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.abtn{background:#16281c;border:1px solid var(--gold-dim);color:var(--ink);padding:6px 14px;
  border-radius:6px;font-size:.82em;transition:.12s;}
.abtn:hover:not(:disabled){border-color:var(--gold);background:#1e3524;}
.abtn:disabled{opacity:.35;cursor:not-allowed;}
.abtn.primary{background:linear-gradient(180deg,var(--gold),#a9853c);color:#1a1205;font-weight:700;
  border:none;}

.draw-arrow{position:absolute;top:-38px;left:50%;transform:translateX(-50%);font-size:1.8em;
  color:var(--gold);animation:bounce 1s infinite;filter:drop-shadow(0 0 6px rgba(217,180,90,.8));
  pointer-events:none;}
.draw-arrow.up{top:auto;bottom:-38px;}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-8px);}}

/* ---------- dice roll overlay (transient, not permanent board space) ---------- */
#dice-overlay-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;
  justify-content:center;z-index:58;pointer-events:none;}
#dice-overlay-bg.show{display:flex;}
#dice-overlay-box{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:14px;
  padding:20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);}
#dice-area{display:flex;gap:10px;align-items:center;}
.die{width:52px;height:52px;border-radius:10px;background:linear-gradient(160deg,#fff,#ccc);
  color:#111;font-size:.8em;font-weight:800;display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:1.05;box-shadow:0 3px 8px rgba(0,0,0,.5);}
.die.spin{animation:diespin2 .8s linear infinite;}
@keyframes diespin2{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}
  100%{transform:rotate(360deg) scale(1)}}
#dice-result{font-size:.95em;text-align:center;min-height:20px;font-weight:600;color:var(--ink);}

/* card visuals */
.card{width:clamp(36px,12.4vw,60px);height:clamp(58px,20vw,94px);border-radius:5px;
  position:relative;overflow:hidden;cursor:pointer;transition:transform .12s;flex-shrink:0;
  user-select:none;font-size:clamp(7px,2.2vw,12px);}
.card:hover{transform:translateY(-6px);z-index:5;}
.card.selected{outline:3px solid var(--gold);outline-offset:1px;transform:translateY(-6px);}
.card.big{width:110px;height:154px;font-size:12px;}
.card.def{transform:rotate(-90deg);}
.card.def:hover{transform:rotate(-90deg) translateY(-4px);}

.card.faceup{border:2px solid #333;display:flex;flex-direction:column;padding:3px 4px;
  font-size:.56em;line-height:1.15;}
.card.faceup.Normal{background:linear-gradient(160deg,#f4dd8a,#c9a83f);color:#3a2c05;}
.card.faceup.Effect{background:linear-gradient(160deg,#f0a35c,#c26a1f);color:#2e1500;}
.card.faceup.Flip{background:linear-gradient(160deg,#e8935a,#a8541f);color:#2e1500;}
.card.faceup.Spell{background:linear-gradient(160deg,#7ee0a3,#2f8a55);color:#062712;}
.card.faceup.Trap{background:linear-gradient(160deg,#e88bb0,#a13060);color:#2e0416;}
.card .c-top{display:flex;align-items:flex-start;gap:2px;}
.card .c-name{font-weight:800;font-size:.78em;line-height:1.12;white-space:normal;
  overflow:hidden;max-height:2.3em;word-break:break-word;flex:1;min-width:0;}
.card .c-art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
  font-size:2.1em;line-height:1;margin:1px 0;background:rgba(0,0,0,.14);border-radius:3px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
.card .c-mid{flex:0 0 auto;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:.72em;opacity:.85;padding:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .c-bot{display:flex;justify-content:space-between;align-items:flex-end;
  font-weight:700;font-size:.85em;}
.card .c-bot .c-stats{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;}
.card .c-bot .c-def{opacity:.8;font-size:.9em;border-top:1px solid rgba(0,0,0,.25);}
.card .c-bot .c-level{flex:0 0 auto;font-size:.85em;font-weight:800;color:var(--gold);
  background:rgba(0,0,0,.35);border-radius:3px;padding:0 4px;align-self:flex-end;}
.card .c-badge{flex:0 0 auto;font-size:.8em;background:rgba(0,0,0,.35);
  border-radius:3px;padding:0 2px;white-space:nowrap;}
.card.big .c-name{font-size:1em;}
.card.big .c-art{font-size:3.4em;}
.card.big .c-mid{font-size:.82em;white-space:normal;}
.card .stars{font-size:.85em;letter-spacing:-1px;}
.card.opp-back{width:52px;height:72px;}

.atkmod-badge{position:absolute;bottom:1px;left:1px;font-size:.75em;font-weight:800;
  background:rgba(0,0,0,.45);padding:0 3px;border-radius:3px;}
.atkmod-badge.up{color:#6fe08a;}
.atkmod-badge.down{color:#f07070;}
.attacker-badge{position:absolute;bottom:1px;right:1px;font-size:.85em;
  background:rgba(0,0,0,.45);padding:0 3px;border-radius:3px;filter:drop-shadow(0 0 3px rgba(255,80,80,.8));}

/* zone contents */
.zone .flags{position:absolute;bottom:-1px;left:-1px;right:-1px;display:flex;justify-content:center;
  gap:2px;font-size:.6em;}

/* side panel (battle log only) */
#detail-panel{width:190px;flex:0 0 190px;background:var(--panel);border-left:2px solid #1c3324;
  padding:12px;display:flex;flex-direction:column;overflow-y:auto;}
#detail-handle{display:none;}
#log-panel{margin-top:0;max-height:100%;
  overflow-y:auto;font-size:.72em;color:var(--dim);display:flex;flex-direction:column;}
#log-panel .lg{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04);}
#log-panel .lg.me{color:#9fd6b0;}
#log-panel .lg.opp{color:#e0a2b8;}
#log-panel .lg.sys{color:var(--gold-dim);}

/* ---------- card zoom popup (real-card-style detail view) ---------- */
#card-popup{position:fixed;top:56px;right:10px;z-index:85;display:none;}
#card-popup.show{display:block;}
#card-popup-close{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;
  background:#16281c;border:1px solid var(--gold);color:var(--ink);font-size:.75em;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;
  box-shadow:0 2px 6px rgba(0,0,0,.5);}
.card.zoom{position:relative;width:clamp(160px,44vw,220px);height:clamp(224px,61.6vw,308px);
  border-radius:10px;font-size:clamp(10px,3vw,14px);box-shadow:0 10px 30px rgba(0,0,0,.6);
  cursor:default;}
.card.zoom:hover{transform:none;}
.card.zoom .c-top{padding-right:20px;}
.card.zoom .c-name{font-size:1.12em;white-space:normal;}
.card.zoom .c-art{font-size:3.4em;flex:1.3;}
.card.zoom .c-type-line{flex:0 0 auto;font-size:.62em;opacity:.85;text-align:center;
  padding:2px 4px;font-weight:700;}
.card.zoom .c-desc{flex:1;font-size:.68em;line-height:1.35;padding:3px 5px;overflow-y:auto;
  white-space:pre-wrap;}
.card.zoom .c-bot{font-size:1em;padding-top:2px;flex-direction:row;justify-content:space-between;align-items:center;}
.card.zoom .c-name{max-height:none;}
.card.zoom.facedown{display:flex;align-items:center;justify-content:center;}
.card.zoom.facedown::after{font-size:2.4em;}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;
  justify-content:center;z-index:80;}
.modal{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:10px;padding:20px;
  max-width:520px;width:90%;max-height:80vh;overflow-y:auto;}
.modal h3{margin-top:0;color:var(--gold);}
.modal .mrow{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;justify-content:center;}
.modal .mopt{background:#16281c;border:1px solid var(--gold-dim);padding:8px 10px 8px 16px;
  border-radius:7px;min-width:100px;display:flex;align-items:center;justify-content:center;gap:8px;}
.modal .mopt:hover{border-color:var(--gold);background:#1e3524;}
.modal .mopt-label{flex:1;text-align:center;}
.modal .mopt-peek{flex:0 0 auto;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.3);border:1px solid var(--gold-dim);color:var(--ink);font-size:.95em;
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.modal .mopt-peek:hover{border-color:var(--gold);background:rgba(0,0,0,.5);}
.modal p.hint{color:var(--dim);font-size:.85em;}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#16281c;
  border:1px solid var(--gold);color:var(--ink);padding:8px 18px;border-radius:20px;z-index:90;
  font-size:.9em;display:none;box-shadow:0 4px 14px rgba(0,0,0,.5);}

/* card browser: deck list / graveyard */
#decklist-btn{position:fixed;top:10px;right:10px;z-index:51;width:38px;height:38px;border-radius:50%;
  background:#16281c;border:1px solid var(--gold-dim);color:var(--ink);font-size:1.1em;
  display:flex;align-items:center;justify-content:center;}
#decklist-btn:hover{border-color:var(--gold);}
.card-list-rows{max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin:10px 0;}
.card-list-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;
  background:#16281c;border:1px solid var(--gold-dim);cursor:pointer;text-align:left;}
.card-list-row:hover{border-color:var(--gold);background:#1e3524;}
.clr-icon{font-size:1.2em;flex:0 0 auto;}
.clr-name{flex:1;font-weight:600;}
.clr-tag{flex:0 0 auto;font-size:.78em;color:var(--dim);white-space:nowrap;}
.tribute-check{font-size:1.1em;flex:0 0 auto;width:1.2em;text-align:center;}
.tribute-row.checked{border-color:var(--gold);background:#2a2410;}
.modal .mopt.primary{background:linear-gradient(180deg,var(--gold),#a9853c);color:#1a1205;font-weight:700;border:none;}
.modal .mopt.primary:hover{filter:brightness(1.08);}
.modal .mopt.disabled{opacity:.4;pointer-events:none;}
.carousel-card-wrap{display:flex;justify-content:center;margin:10px 0;}

#gameover-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;
  justify-content:center;z-index:95;flex-direction:column;gap:16px;}
#gameover-bg h1{font-size:2.4em;color:var(--gold);margin:0;}

/* ---------- turn banner ---------- */
#turn-flash-wrap{position:fixed;top:42%;left:0;right:0;display:flex;justify-content:center;
  pointer-events:none;z-index:60;}
#turn-flash-text{background:linear-gradient(90deg,transparent,rgba(217,180,90,.96) 15%,
  rgba(217,180,90,.96) 85%,transparent);padding:16px 0;width:100%;text-align:center;
  font-size:clamp(1.2em,5vw,2.2em);font-weight:900;letter-spacing:3px;color:#1a1205;
  transform:translateX(-130vw);opacity:0;white-space:nowrap;}
#turn-flash-text.show{animation:turnFlash 1.5s cubic-bezier(.2,.9,.3,1) forwards;}
@keyframes turnFlash{
  0%{transform:translateX(-130vw);opacity:0;}
  16%{transform:translateX(0);opacity:1;}
  72%{transform:translateX(0);opacity:1;}
  100%{transform:translateX(130vw);opacity:0;}
}
#phase-flash{position:absolute;left:50%;top:-6px;transform:translate(-50%,0) scale(.7);
  opacity:0;color:var(--gold);font-weight:800;font-size:.85em;letter-spacing:2px;
  pointer-events:none;white-space:nowrap;}
#phase-flash.show{animation:phasePop .75s ease-out forwards;}
@keyframes phasePop{
  0%{opacity:0;transform:translate(-50%,6px) scale(.7);}
  25%{opacity:1;transform:translate(-50%,-6px) scale(1.08);}
  75%{opacity:1;transform:translate(-50%,-6px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-16px) scale(1);}
}

/* ---------- floating damage/heal numbers ---------- */
.float-num{position:fixed;transform:translate(-50%,0);font-weight:900;font-size:1.3em;
  pointer-events:none;z-index:70;animation:floatUp .9s ease-out forwards;}
.float-num.dmg{color:#ff5a5a;text-shadow:0 0 8px rgba(255,0,0,.7),0 1px 2px #000;}
.float-num.heal{color:#5aff8a;text-shadow:0 0 8px rgba(0,255,80,.7),0 1px 2px #000;}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.6);}
  18%{opacity:1;transform:translate(-50%,-14px) scale(1.2);}
  100%{opacity:0;transform:translate(-50%,-64px) scale(1);}
}

/* ---------- card pop-in (summon/set/activate) ---------- */
@keyframes popIn{
  0%{transform:scale(.35) rotate(-10deg);opacity:0;filter:brightness(2.2);}
  55%{transform:scale(1.1) rotate(3deg);opacity:1;}
  100%{transform:scale(1) rotate(0deg);opacity:1;filter:brightness(1);}
}
.card.pop-in{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3);}

/* ---------- attack clash ---------- */
@keyframes lungeUp{0%{transform:translateY(0) scale(1);}
  45%{transform:translateY(-16px) scale(1.1);}100%{transform:translateY(0) scale(1);}}
@keyframes lungeDown{0%{transform:translateY(0) scale(1);}
  45%{transform:translateY(16px) scale(1.1);}100%{transform:translateY(0) scale(1);}}
.card.clash-lunge-up{animation:lungeUp .38s ease-out;z-index:8;}
.card.clash-lunge-down{animation:lungeDown .38s ease-out;z-index:8;}
@keyframes hitFlash{0%{filter:brightness(1);}
  30%{filter:brightness(2.6) saturate(0);transform:translateX(-4px);}
  60%{transform:translateX(4px);}100%{filter:brightness(1);transform:translateX(0);}}
.card.clash-hit{animation:hitFlash .38s ease-out;z-index:7;}

/* ---------- destroy shatter (clone overlay) ---------- */
.destroy-clone{position:fixed;margin:0;z-index:55;pointer-events:none;
  transition:transform .5s cubic-bezier(.5,-0.2,.7,.35),opacity .5s ease-in;}
.destroy-clone.go{transform:scale(.15) rotate(40deg);opacity:0;filter:brightness(2) saturate(0);}

/* ---------- beam: connects a source card to a target card during a reaction ---------- */
.fx-beam{position:fixed;height:4px;transform-origin:0 50%;z-index:57;pointer-events:none;
  opacity:0;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,220,120,0),rgba(255,220,120,.95) 15%,
    rgba(255,220,120,.95) 85%,rgba(255,220,120,0));
  box-shadow:0 0 10px 2px rgba(255,220,120,.75);}
.fx-beam.go{animation:beamPulse .46s ease-out forwards;}
@keyframes beamPulse{0%{opacity:0;}18%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}
.fx-beam.trap{background:linear-gradient(90deg,rgba(230,110,180,0),rgba(230,110,180,.95) 15%,
    rgba(230,110,180,.95) 85%,rgba(230,110,180,0));box-shadow:0 0 10px 2px rgba(230,110,180,.75);}
.fx-beam.spell{background:linear-gradient(90deg,rgba(110,225,160,0),rgba(110,225,160,.95) 15%,
    rgba(110,225,160,.95) 85%,rgba(110,225,160,0));box-shadow:0 0 10px 2px rgba(110,225,160,.75);}
.fx-zap{animation:zapFlash .42s ease-out;}
@keyframes zapFlash{0%{filter:brightness(1);}30%{filter:brightness(2.4) saturate(0);}100%{filter:brightness(1);}}

/* ---------- dice landed bounce ---------- */
.die.landed{animation:diceLanded .32s ease-out;}
@keyframes diceLanded{0%{transform:scale(1.5);}55%{transform:scale(.88);}100%{transform:scale(1);}}

@media (max-width:760px){
  #phase-track{display:none;}
  #detail-panel{position:fixed;left:0;right:0;bottom:0;width:100%;flex:none;
    border-left:none;border-top:2px solid #1c3324;max-height:32vh;z-index:65;
    transform:translateY(calc(100% - 34px));transition:transform .25s ease;
    box-shadow:0 -6px 18px rgba(0,0,0,.5);padding:0 12px 12px;}
  #detail-panel.expanded{transform:translateY(0);}
  #detail-handle{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:0 -12px 8px;padding:8px 12px;cursor:pointer;background:#16281c;
    border-bottom:1px solid #234;font-size:.75em;color:var(--dim);}
  #detail-handle-text{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  #log-panel{max-height:26vh;}
  #card-popup{top:52px;right:6px;}
}
</style>
</head>

  try{
    if(window.caches && caches.keys){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  const url=new URL(location.href);
  url.searchParams.set('_r',Date.now().toString());
  location.replace(url.toString());
});

function flashTurnBanner(text){
  const el=document.getElementById('turn-flash-text');
  el.classList.remove('show'); void el.offsetWidth; el.textContent=text; el.classList.add('show');
}
function flashPhase(text){
  const el=document.getElementById('phase-flash');
  if(!el) return;
  el.classList.remove('show'); void el.offsetWidth; el.textContent=text; el.classList.add('show');
}
function markJustPlaced(uid){
  justPlacedSet.add(uid);
  setTimeout(()=>justPlacedSet.delete(uid),650);
}
function floatNumber(pIdx,text,cls){
  const anchor=document.getElementById(pIdx===ME?'hn-me':'hn-opp');
  if(!anchor) return;
  const rect=anchor.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='float-num '+cls; el.textContent=text;
  el.style.left=(rect.left+rect.width/2)+'px'; el.style.top=rect.top+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}
function zoneCardEl(pIdx,type,idx){
  return document.querySelector(`.zone[data-side="${pIdx}"][data-type="${type}"][data-idx="${idx}"] .card`);
}
function playClashAnimation(attackerSide,defenderSide,atkIdx,targetIdx,cb){
  const atkEl=zoneCardEl(attackerSide,'mon',atkIdx);
  const defEl= targetIdx>=0 ? zoneCardEl(defenderSide,'mon',targetIdx) : null;
  SFX.swing();
  if(atkEl) atkEl.classList.add(attackerSide===ME?'clash-lunge-up':'clash-lunge-down');
  if(defEl) defEl.classList.add('clash-hit');
  if(atkEl && defEl) playBeam(atkEl,defEl,'battle');
  setTimeout(()=>{ SFX.hit(); cb(); },380);
}
function playBeam(fromEl,toEl,cls){
  if(!fromEl || !toEl) return;
  const r1=fromEl.getBoundingClientRect(), r2=toEl.getBoundingClientRect();
  const x1=r1.left+r1.width/2, y1=r1.top+r1.height/2;
  const x2=r2.left+r2.width/2, y2=r2.top+r2.height/2;
  const dist=Math.hypot(x2-x1,y2-y1);
  const angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  const beam=document.createElement('div');
  beam.className='fx-beam '+(cls||'');
  beam.style.left=x1+'px'; beam.style.top=y1+'px'; beam.style.width=dist+'px';
  beam.style.transform=`rotate(${angle}deg)`;
  document.body.appendChild(beam);
  requestAnimationFrame(()=>beam.classList.add('go'));
  setTimeout(()=>beam.remove(),460);
  [fromEl,toEl].forEach(el=>{ el.classList.add('fx-zap'); setTimeout(()=>el.classList.remove('fx-zap'),420); });
}
function playBeamsToTargets(fromEl,targets,cls){
  targets.forEach(t=>{ if(t) playBeam(fromEl,t,cls); });
}
function playBeamThenRun(fromEl,targetEls,runFn,cls){
  const targets=targetEls.filter(Boolean);
  if(fromEl && targets.length){ playBeamsToTargets(fromEl,targets,cls||'spell'); setTimeout(runFn,320); }
  else runFn();
}
function playDestroyClone(pIdx,type,zoneIdx){
  const el=zoneCardEl(pIdx,type,zoneIdx);
  if(!el){ if(type==='mon') SFX.destroy(); return; }
  const rect=el.getBoundingClientRect();
  const clone=el.cloneNode(true);
  clone.classList.add('destroy-clone');
  clone.style.left=rect.left+'px'; clone.style.top=rect.top+'px';
  clone.style.width=rect.width+'px'; clone.style.height=rect.height+'px';
  document.body.appendChild(clone);
  requestAnimationFrame(()=>clone.classList.add('go'));
  setTimeout(()=>clone.remove(),520);
  SFX.destroy();
}

  const d=DB[baseId];
  return Object.assign({uid:uidc++, baseId, faceDown:false, pos:'atk', controller:null, zone:-1,
    summonedTurn:-1, attacked:false, tempAtk:0, equips:[], negated:false}, {});
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function buildDeck(){
  const all=[...MONSTER_DB,...SPELLTRAP_DB].map(c=>newCardInstance(c.id));
  return shuffle(all);
}

function log(msg,cls){G.log.push({msg,cls:cls||'sys'});renderLog();}
function base(card){return DB[card.baseId];}
function isMonster(card){return base(card).cat==='Monster';}

/* ============================= SETUP FLOW ============================= */
document.querySelectorAll('.health-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.health-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); G.startHealth=parseInt(b.dataset.hp,10);
  });
});
document.getElementById('start-btn').addEventListener('click',startCoinFlip);

function startCoinFlip(){
  document.getElementById('setup-wrap').style.display='none';
  const wrap=document.getElementById('coin-flip-wrap');
  wrap.style.display='flex';
  const d1=document.getElementById('d1a'), d2=document.getElementById('d1b');

      res.textContent="Tie! Rolling again...";

    } else {

    }

function startCoinFlip2(){
  document.getElementById('coin-result').textContent='';
  startCoinFlip();
}

function beginDuel(){
  document.getElementById('start-screen').style.display='none';
  document.getElementById('game-root').style.display='flex';
  G.health=[G.startHealth,G.startHealth];
  G.deck=buildDeck();
  G.gy=[];
  G.players[ME]={hand:[],mon:[null,null,null,null],st:[null,null,null,null],normalSummonUsed:false};
  G.players[BOT]={hand:[],mon:[null,null,null,null],st:[null,null,null,null],normalSummonUsed:false};
  // opening hands: 5 each
  for(let i=0;i<5;i++){
    drawCard(ME,true); drawCard(BOT,true);
  }
  G.active=G.first; G.turnNum=1;
  log(`${G.first===ME?'You':'Bot'} won the roll and go first.`,'sys');
  startTurn();
}

function drawCard(pIdx,silent){
  if(G.deck.length===0){
    if(G.gy.length===0){ return null; }
    log('Deck empty — shuffling Graveyard back in.','sys');
    G.deck=shuffle(G.gy); G.gy=[];
  }
  const c=G.deck.pop();
  G.players[pIdx].hand.push(c);
  if(!silent){
    log(`${pIdx===ME?'You':'Bot'} drew a card. (${G.players[pIdx].hand.length} in hand)`, pIdx===ME?'me':'opp');
    SFX.draw();
    markJustPlaced(c.uid);
  }
  return c;
}

/* ============================= TURN / PHASE FLOW ============================= */
const PHASES=['draw','standby','main1','battle','main2','end'];
function isVeryFirstTurn(){return G.turnNum===1 && G.active===G.first;}

function startTurn(){
  const p=G.players[G.active];
  p.normalSummonUsed=false;
  Object.values(p.mon).forEach(m=>{if(m){m.attacked=false;}});
  G.selection=null;
  flashTurnBanner(G.active===ME?"YOUR TURN":"BOT'S TURN");
  SFX.turn();
  goPhase('draw');
}
const PHASE_LABELS={draw:'Draw Phase',standby:'Standby Phase',main1:'Main Phase 1',
  battle:'Battle Phase',main2:'Main Phase 2',end:'End Phase'};
function goPhase(ph){
  G.phase=ph; render();
  flashPhase(PHASE_LABELS[ph]);
  SFX.phase();
  if(ph==='draw') doDrawPhase();
  else if(ph==='standby') doStandbyPhase();
  else if(ph==='main1') doMainPhase();
  else if(ph==='battle') doBattlePhase();
  else if(ph==='main2') doMainPhase();
  else if(ph==='end') doEndPhase();
}
function advancePhase(){
  if(G.gameOver) return;
  const skipBattle = isVeryFirstTurn();
  const order = skipBattle ? ['draw','standby','main1','main2','end'] : PHASES;
  let idx=order.indexOf(G.phase);
  idx++;
  if(idx>=order.length){ endTurn(); return; }
  goPhase(order[idx]);
}

function doDrawPhase(){
  if(isVeryFirstTurn()){
    log(`${G.active===ME?'You skip':'Bot skips'} the Draw Phase (going first).`,'sys');
    setTimeout(advancePhase, G.active===BOT?500:0);
    return;
  }
  if(G.active===ME){
    render(); // shows arrow, waits for click on deck
  } else {
    setTimeout(()=>{ drawCard(BOT); render(); setTimeout(advancePhase,600); },600);
  }
}
function humanDrawClick(){
  if(G.phase!=='draw'||G.active!==ME) return;
  drawCard(ME);
  render();
  setTimeout(advancePhase,400);
}

function doStandbyPhase(){
  const lavaGolem=G.players[G.active].mon.find(m=>m && !m.faceDown && base(m).fx==='lava_golem');
  if(lavaGolem){
    dealDamage(G.active,700);
    log(`Lava Golem inflicts 700 damage during the Standby Phase!`, G.active===ME?'me':'opp');
  }
  G.gy.forEach(c=>{
    if(isMonster(c) && base(c).fx==='spirit_of_the_fall_wind' && c.controller===G.active){
      gainHealth(G.active,500);
      log(`Spirit of the Fall Wind grants 500 Health from the Graveyard.`, G.active===ME?'me':'opp');
    }
  });
  [ME,BOT].forEach(s=>{
    const be=G.players[s].mon.find(m=>m && !m.faceDown && base(m).fx==='big_eye');
    if(be && s===ME && G.deck.length){
      showModal('Big Eye','Look at the top card of the Deck?',[
        {label:'View', action:()=>showCardPopup(previewInstance(base(G.deck[G.deck.length-1])),false)},
        {label:'Skip', action:()=>{}},
      ]);
    }
  });
  rollDice(()=>{ setTimeout(advancePhase, G.active===BOT?700:900); });
}
function rollDice(cb){
  const overlay=document.getElementById('dice-overlay-bg');
  const area=document.getElementById('dice-area');
  const resultEl=document.getElementById('dice-result');
  resultEl.textContent='';
  overlay.classList.add('show');
  area.innerHTML='<div class="die spin" id="dieA">?</div><div class="die spin" id="dieB">?</div><div class="die spin" id="dieC">?</div>';
  const faces=[ATTRS,['BUFF','BUFF','BUFF','DEBUFF','DEBUFF','DEBUFF'],[100,200,400,600,800,1000]];
  const els=[document.getElementById('dieA'),document.getElementById('dieB'),document.getElementById('dieC')];
  SFX.diceRoll();
  const spin=setInterval(()=>{
    els.forEach((el,i)=>{el.textContent=faces[i][Math.floor(Math.random()*faces[i].length)];});
  },70);
  setTimeout(()=>{
    clearInterval(spin);
    const a=faces[0][Math.floor(Math.random()*6)];
    const bd=faces[1][Math.floor(Math.random()*6)];
    const v=faces[2][Math.floor(Math.random()*6)];
    els.forEach(el=>{el.classList.remove('spin');el.classList.add('landed');});
    els[0].textContent=a; els[1].textContent=bd; els[2].textContent=v;
    SFX.diceLand();
    const delta = bd==='BUFF' ? v : -v;
    G.attrMod = {a,delta};
    const who = G.active===ME?'Your':"Bot's";
    resultEl.textContent = `${who} roll: ${a} monsters ${delta>=0?'+':''}${delta} ATK this turn!`;
    log(`Dice: ${a} / ${bd} / ${v} — all ${a} monsters on the field ${delta>=0?'gain':'lose'} ${v} ATK until the next Standby Phase.`, 'sys');
    render();
    setTimeout(()=>overlay.classList.remove('show'),900);
    if(cb) cb();
  },1000);
}
function effAtk(card){
  const b=base(card);
  let atk=b.atk + (card.tempAtk||0);
  card.equips.forEach(eq=>{ if(eq==='amulet_of_ambition'||eq==='horn_of_unicorn') atk+=700; if(eq==='axe_of_fools') atk+=1000; });
  if(b.fx==='united_resistance') atk+=300*G.gy.filter(c=>isMonster(c)&&base(c).typ==='Warrior').length;
  if(G.attrMod && b.a===G.attrMod.a) atk+=G.attrMod.delta;
  if(atk<0) atk=0;
  return atk;
}
function effDef(card){
  const b=base(card);
  let def=b.def;
  card.equips.forEach(eq=>{ if(eq==='amulet_of_ambition'||eq==='horn_of_unicorn') def+=700; });
  if(G.attrMod && b.a===G.attrMod.a) def+=G.attrMod.delta;
  if(def<0) def=0;
  return def;
}

function doMainPhase(){
  render();
  if(G.active===BOT) botMainPhase();
}
function doBattlePhase(){
  render();
  if(G.active===BOT) botBattlePhase();
}
function doEndPhase(){
  G.attrMod=null; // dice effect expires (a fresh one rolls next standby)
  const p=G.players[G.active];
  Object.values(p.mon).forEach(m=>{if(m) m.tempAtk=0;});
  render();
  setTimeout(endTurn, G.active===BOT?500:300);
}
function endTurn(){
  if(G.gameOver) return;
  G.active = 1-G.active;
  G.turnNum++;
  startTurn();
}

/* ============================= WIN CHECK ============================= */
function checkWin(){
  if(G.health[ME]<=0){ endGame(BOT); return true; }
  if(G.health[BOT]<=0){ endGame(ME); return true; }
  return false;
}
function endGame(winner){
  G.gameOver=true;
  document.getElementById('go-title').textContent = winner===ME? 'Victory!' : 'Defeat...';
  document.getElementById('go-sub').textContent = winner===ME? 'You reduced the Bot to 0 Health.' : 'Your Health hit 0.';
  document.getElementById('gameover-bg').style.display='flex';
  if(winner===ME) SFX.victory(); else SFX.defeat();
}
function dealDamage(pIdx,amount,isBattle){
  if(amount<=0) return;
  if(isBattle && G.noBattleDamage[pIdx]){ log(`Kuriboh's shield prevents the Battle Damage.`,'sys'); return; }
  G.health[pIdx]=Math.max(0,G.health[pIdx]-amount);
  floatNumber(pIdx,'-'+amount,'dmg');
  SFX.hit();
  render();
  checkWin();
}
function gainHealth(pIdx,amount){
  G.health[pIdx]+=amount;
  floatNumber(pIdx,'+'+amount,'heal');
  SFX.heal();
  render();
}

/* ============================= CARD MOVEMENT HELPERS ============================= */
function sendToGY(pIdx,card,fromZoneType,zoneIdx,reason){
  if(fromZoneType==='mon'||fromZoneType==='st') playDestroyClone(pIdx,fromZoneType,zoneIdx);
  const p=G.players[pIdx];
  if(fromZoneType==='mon') p.mon[zoneIdx]=null;
  else if(fromZoneType==='st') p.st[zoneIdx]=null;
  else if(fromZoneType==='hand') p.hand=p.hand.filter(c=>c.uid!==card.uid);
  if(fromZoneType==='mon' && isMonster(card)){
    if(card.blastChained) dealDamage(pIdx,500);
    p.st.forEach((c,i)=>{ if(c && !c.faceDown && c.equippedSide===pIdx && c.equippedIdx===zoneIdx){ G.gy.push(c); p.st[i]=null; } });
  }
  card.equips=[];
  const banished=fromZoneType==='mon' && card.banishOnLeave;
  if(banished){ log(`${base(card).n} is banished instead of going to the Graveyard.`,'sys'); }
  else G.gy.push(card);
  if(fromZoneType==='st') destroyLinkedContinuous(card.uid);
  if(reason==='battle' && isMonster(card)) triggerOnDestroyedByBattle(pIdx,card);
  if(!banished && isMonster(card)) triggerOnSentToGY(pIdx,card);
}
function destroyLinkedContinuous(trapUid){
  [ME,BOT].forEach(s=>{
    G.players[s].mon.forEach((m,i)=>{
      if(m && m.linkedContinuous===trapUid){
        log(`${base(m).n} is destroyed as its linked Trap left the field.`,'sys');
        sendToGY(s,m,'mon',i,'effect');
      }
    });
  });
}
function banish(pIdx,card,fromZoneType,zoneIdx){
  if(fromZoneType==='mon'||fromZoneType==='st') playDestroyClone(pIdx,fromZoneType,zoneIdx);
  const p=G.players[pIdx];
  if(fromZoneType==='mon') p.mon[zoneIdx]=null;
  else if(fromZoneType==='st'){ p.st[zoneIdx]=null; destroyLinkedContinuous(card.uid); }
  if(fromZoneType==='mon' && isMonster(card)){
    p.st.forEach((c,i)=>{ if(c && !c.faceDown && c.equippedSide===pIdx && c.equippedIdx===zoneIdx){ G.gy.push(c); p.st[i]=null; } });
  }
  // banished cards are simply removed from the game (not tracked further)
}
function findEmptyZone(pIdx,type){
  const z=G.players[pIdx][type];
  for(let i=0;i<4;i++) if(!z[i]) return i;
  return -1;
}

/* ---- triggers ---- */
function triggerOnDestroyedByBattle(pIdx,card){
  // Michizure triggers off "your monster destroyed by battle" for its OWN controller.
  const opp=1-pIdx;
  G.players[pIdx].st.forEach((c,i)=>{
    if(c && c.faceDown && c.baseId==='michizure'){
      offerTrapActivation(pIdx,i,c,()=>{
        const targets=[];
        G.players[opp].mon.forEach((m,zi)=>{ if(m && base(m).l>=base(card).l) targets.push(zi); });
        if(targets.length===0){
          log("Michizure had no valid target.","sys");
          sendToGY(pIdx,c,'st',i,'effect');
          render();
          return;
        }
        chooseOrAuto(pIdx,targets,(zi)=>{
          const t=G.players[opp].mon[zi];
          const trapEl=zoneCardEl(pIdx,'st',i), targetEl=zoneCardEl(opp,'mon',zi);
          const finish=()=>{
            log(`Michizure destroys ${base(t).n}.`, pIdx===ME?'me':'opp');
            sendToGY(opp,t,'mon',zi,'effect');
            sendToGY(pIdx,c,'st',i,'effect');
            render();
          };
          if(trapEl && targetEl){ playBeam(trapEl,targetEl,'trap'); setTimeout(finish,320); }
          else finish();
        });
      });
    }
  });
}
function triggerOnSentToGY(pIdx,card){
  if(base(card).fx==='witch_of_the_black_forest'){
    const opp=pIdx;
    const deck=G.deck;
    const opts=deck.map((c,i)=>({c,i})).filter(o=>isMonster(o.c)&&base(o.c).def<=1500);
    if(opts.length){
      // auto for bot, prompt for human
      if(pIdx===ME){
        showModal('Witch of the Black Forest',`Add 1 monster with 1500 or less DEF from your Deck to your hand?`,[
          {label:'Search',action:()=>{ const pick=opts[Math.floor(Math.random()*opts.length)]; deck.splice(pick.i,1); G.deck=deck; G.players[pIdx].hand.push(pick.c); shuffleAfterSearch(); log(`Added ${base(pick.c).n} to hand.`,'me'); render(); }},
          {label:'Skip',action:()=>{}},
        ]);
      } else {
        const pick=opts[Math.floor(Math.random()*opts.length)];
        G.deck=G.deck.filter(c=>c.uid!==pick.c.uid);
        G.players[pIdx].hand.push(pick.c);
        shuffleAfterSearch();
        log(`Bot's Witch of the Black Forest added a monster to hand.`,'opp');
        render();
      }
    }
  }
}
function shuffleAfterSearch(){ shuffle(G.deck); }

/* ============================= RENDER ============================= */
function attrAbbr(a){return {LIGHT:'LGT',DARK:'DRK',EARTH:'ERT',WATER:'WTR',FIRE:'FIR',WIND:'WND'}[a]||a;}
function starStr(l){return '★'.repeat(Math.min(l,12));}

function renderCardEl(card,opts){
  opts=opts||{};
  const d=document.createElement('div');
  d.className='card';
  if(opts.big) d.classList.add('big');
  const faceDown = opts.faceDown!==undefined ? opts.faceDown : card.faceDown;
  if(faceDown){
    d.classList.add('facedown');
    if(opts.zoneCard && card.pos==='def') d.classList.add('def');
  } else {
    const b=base(card);
    const kindClass = b.cat==='Monster' ? (b.k==='Normal'?'Normal':(b.k==='Flip'?'Flip':'Effect')) : b.cat;
    d.classList.add('faceup',kindClass);
    if(opts.zoneCard && card.pos==='def') d.classList.add('def');
    const top=document.createElement('div'); top.className='c-top';
    const name=document.createElement('div'); name.className='c-name'; name.textContent=b.n; top.appendChild(name);
    if(b.cat!=='Monster'){
      const badge=document.createElement('div'); badge.className='c-badge';
      badge.textContent=b.cat[0];
      top.appendChild(badge);
    }
    d.appendChild(top);
    const art=document.createElement('div'); art.className='c-art'; art.textContent=b.em; d.appendChild(art);
    const mid=document.createElement('div'); mid.className='c-mid';
    if(b.cat==='Monster'){ mid.textContent = opts.big? (b.e||'') : `${attrAbbr(b.a)} ${b.typ}`; }
    else { mid.textContent = opts.big? (b.e||'') : b.sub; }
    d.appendChild(mid);
    if(b.cat==='Monster'){
      const bot=document.createElement('div'); bot.className='c-bot';
      const atk=card.zone>=0?effAtk(card):b.atk, def=card.zone>=0?effDef(card):b.def;
      bot.innerHTML=`<span class="c-level">${b.l}</span><span class="c-stats"><span class="c-atk">${atk}</span><span class="c-def">${def}</span></span>`;
      d.appendChild(bot);
      if(card.zone>=0 && G.attrMod && b.a===G.attrMod.a){
        const am=document.createElement('div'); am.className='atkmod-badge '+(G.attrMod.delta>=0?'up':'down');
        am.textContent=(G.attrMod.delta>=0?'+':'')+G.attrMod.delta;
        d.appendChild(am);
      }
      if(card.controller===ME && G.selection && G.selection.type==='attack' && G.selection.attackerIdx===card.zone){
        const sw=document.createElement('div'); sw.className='attacker-badge'; sw.textContent='⚔️';
        d.appendChild(sw);
      }
    }
  }
  const popupHidden = faceDown && !opts.mine;
  d.addEventListener('mouseenter',()=>showCardPopup(card,popupHidden));
  d.addEventListener('mouseleave',()=>hideCardPopup());
  d.addEventListener('click',(e)=>{ e.stopPropagation(); if(opts.onClick) opts.onClick(); showCardPopup(card,popupHidden); });
  return d;
}

/* ---- zoomed card popup: a full Yu-Gi-Oh-style card view, docked top-right ---- */
function buildZoomCard(card,faceDown){
  const d=document.createElement('div');
  d.className='card zoom';
  if(faceDown){ d.classList.add('facedown'); return d; }
  const b=base(card);
  const kindClass = b.cat==='Monster' ? (b.k==='Normal'?'Normal':(b.k==='Flip'?'Flip':'Effect')) : b.cat;
  d.classList.add('faceup',kindClass);
  const top=document.createElement('div'); top.className='c-top';
  const name=document.createElement('div'); name.className='c-name'; name.textContent=b.n; top.appendChild(name);
  const badge=document.createElement('div'); badge.className='c-badge';
  badge.textContent = b.cat==='Monster' ? starStr(b.l) : b.cat.toUpperCase();
  top.appendChild(badge);
  d.appendChild(top);
  const art=document.createElement('div'); art.className='c-art'; art.textContent=b.em; d.appendChild(art);
  const typeLine=document.createElement('div'); typeLine.className='c-type-line';
  typeLine.textContent = b.cat==='Monster' ? `${b.a} · ${b.typ} · ${b.k}` : `${b.sub} ${b.cat} Card`;
  d.appendChild(typeLine);
  const desc=document.createElement('div'); desc.className='c-desc'; desc.textContent=b.e||''; d.appendChild(desc);
  if(b.cat==='Monster'){
    const bot=document.createElement('div'); bot.className='c-bot';
    const atk=card.zone>=0?effAtk(card):b.atk, def=card.zone>=0?effDef(card):b.def;
    bot.innerHTML=`<span>ATK ${atk}</span><span>DEF ${def}</span>`;
    d.appendChild(bot);
  }
  return d;
}
function showCardPopup(card,faceDown){
  const inner=document.getElementById('card-popup-inner');
  inner.innerHTML='';
  inner.appendChild(buildZoomCard(card,faceDown));
  document.getElementById('card-popup').classList.add('show');
}
function hideCardPopup(){
  document.getElementById('card-popup').classList.remove('show');
}
document.getElementById('card-popup-close').addEventListener('click',(e)=>{ e.stopPropagation(); hideCardPopup(); });
document.addEventListener('click',(e)=>{
  const pop=document.getElementById('card-popup');
  if(pop.classList.contains('show') && !pop.contains(e.target)) hideCardPopup();
});

function renderZoneRow(elId,pIdx,type){
  const el=document.getElementById(elId);
  el.innerHTML='';
  const arr=G.players[pIdx][type];
  for(let i=0;i<4;i++){
    const zone=document.createElement('div');
    zone.className='zone '+(type==='mon'?'mon':'st');
    zone.dataset.side=pIdx; zone.dataset.type=type; zone.dataset.idx=i;
    const card=arr[i];
    if(card){
      const opp = pIdx===BOT;
      const faceDown = card.faceDown;
      const cel=renderCardEl(card,{zoneCard:true,faceDown,mine:pIdx===ME, onClick:()=>onZoneCardClick(pIdx,type,i)});
      if(justPlacedSet.has(card.uid)) cel.classList.add('pop-in');
      zone.appendChild(cel);
    } else {
      zone.addEventListener('click',()=>onEmptyZoneClick(pIdx,type,i));
    }
    if(isZoneTargetable(pIdx,type,i)) zone.classList.add('targetable');
    if(isZonePlaceable(pIdx,type,i)) zone.classList.add('placeable');
    el.appendChild(zone);
  }
}
function isCeremonialBellActive(){
  return [ME,BOT].some(s=>G.players[s].mon.some(m=>m && !m.faceDown && base(m).fx==='ceremonial_bell'));
}
function renderHandRow(elId,pIdx){
  const el=document.getElementById(elId);
  el.innerHTML='';
  const hand=G.players[pIdx].hand;
  const faceDown = pIdx===BOT && !isCeremonialBellActive();
  hand.forEach(card=>{
    const cel=renderCardEl(card,{faceDown, onClick: pIdx===ME? ()=>onHandCardClick(card): null});
    if(faceDown) cel.classList.add('opp-back');
    if(G.selection && G.selection.type==='hand' && G.selection.uid===card.uid) cel.classList.add('selected');
    if(justPlacedSet.has(card.uid)) cel.classList.add('pop-in');
    el.appendChild(cel);
  });
}

function render(){
  if(G.gameOver) return;
  document.getElementById('hb-me').style.height=(100*G.health[ME]/G.startHealth)+'%';
  document.getElementById('hb-opp').style.height=(100*G.health[BOT]/G.startHealth)+'%';
  document.getElementById('hn-me').textContent=G.health[ME];
  document.getElementById('hn-opp').textContent=G.health[BOT];
  document.getElementById('deck-count').textContent=G.deck.length;
  document.getElementById('gy-count').textContent=G.gy.length;
  document.getElementById('handcount-me').textContent='H:'+G.players[ME].hand.length;
  document.getElementById('handcount-opp').textContent='H:'+G.players[BOT].hand.length;

  renderZoneRow('mon-me',ME,'mon'); renderZoneRow('st-me',ME,'st');
  renderZoneRow('mon-opp',BOT,'mon'); renderZoneRow('st-opp',BOT,'st');
  renderHandRow('hand-me',ME); renderHandRow('hand-opp',BOT);
  document.getElementById('hand-me').classList.toggle('active-turn',G.active===ME);
  document.getElementById('hand-opp').classList.toggle('active-turn',G.active===BOT);

  const phaseLabels={draw:'Draw',standby:'Standby',main1:'Main 1',battle:'Battle',main2:'Main 2',end:'End'};
  document.getElementById('turn-banner').textContent = (G.active===ME?"YOUR TURN":"BOT'S TURN")+` · Turn ${G.turnNum} · ${phaseLabels[G.phase]}`;
  const track=document.getElementById('phase-track'); track.innerHTML='';
  PHASES.forEach(ph=>{
    const pip=document.createElement('div'); pip.className='phase-pip'+(G.phase===ph?' active':'');
    pip.textContent=phaseLabels[ph]; track.appendChild(pip);
  });
  const chip=document.getElementById('mod-chip');
  if(G.attrMod){
    chip.textContent=`${G.attrMod.a} ${G.attrMod.delta>=0?'+':''}${G.attrMod.delta} ATK`;
    chip.classList.add('show');
  } else chip.classList.remove('show');

  renderActionButtons();

  const deckPile=document.getElementById('pile-deck');
  const existingArrow=deckPile.querySelector('.draw-arrow');
  if(existingArrow) existingArrow.remove();
  if(G.phase==='draw' && G.active===ME && !isVeryFirstTurn()){
    const ar=document.createElement('div'); ar.className='draw-arrow'; ar.textContent='▼';
    deckPile.appendChild(ar);
  }
  syncRailHeights();
}
function syncRailHeights(){
  // Some mobile browsers mis-stretch a flex sibling with an auto-height nested
  // flex:1 descendant, so pin the rails to #board's real rendered height explicitly
  // instead of relying on align-items:stretch.
  const board=document.getElementById('board');
  const h=board.getBoundingClientRect().height;
  if(h<=0) return;
  const px=h+'px';
  document.getElementById('hp-rail-opp').style.height=px;
  document.getElementById('hp-rail-me').style.height=px;
}
window.addEventListener('resize',()=>{ if(document.getElementById('game-root').style.display!=='none') syncRailHeights(); });
function renderLog(){
  const el=document.getElementById('log-panel');
  el.innerHTML='';
  G.log.slice(-60).reverse().forEach(l=>{
    const d=document.createElement('div'); d.className='lg '+l.cls; d.textContent=l.msg; el.appendChild(d);
  });
  const handleText=document.getElementById('detail-handle-text');
  if(handleText && G.log.length) handleText.textContent=G.log[G.log.length-1].msg;
}

function renderActionButtons(){
  const el=document.getElementById('action-buttons'); el.innerHTML='';
  if(G.active!==ME || G.gameOver) return;
  if(G.phase==='main1'||G.phase==='main2'){
    const toBattle=document.createElement('button'); toBattle.className='abtn primary';
    toBattle.textContent = G.phase==='main1' ? (isVeryFirstTurn()? 'Go to Main 2 ▶':'Go to Battle Phase ▶') : 'End Turn ▶';
    toBattle.onclick=()=>{ if(G.selection){G.selection=null; render();} advancePhase(); };
    el.appendChild(toBattle);
  }
  if(G.phase==='battle'){
    const toM2=document.createElement('button'); toM2.className='abtn primary';
    toM2.textContent='Go to Main Phase 2 ▶';
    toM2.onclick=()=>{ G.selection=null; advancePhase(); };
    el.appendChild(toM2);
  }
  if(G.selection){
    const cancel=document.createElement('button'); cancel.className='abtn';
    cancel.textContent='Cancel'; cancel.onclick=()=>{G.selection=null; render();};
    el.appendChild(cancel);
  }
}

/* ============================= PLAYER INTERACTION ============================= */
document.getElementById('pile-deck').addEventListener('click',humanDrawClick);
document.getElementById('pile-gy').addEventListener('click',()=>{
  showGYModal();
});
function showGYModal(){
  openCardBrowser('Graveyard ('+G.gy.length+')', defsFromInstances(G.gy));
}

function onHandCardClick(card){
  if(G.active!==ME) return;
  if(G.phase!=='main1' && G.phase!=='main2') { toast("You can only play cards during a Main Phase."); return; }
  const b=base(card);
  if(b.fx==='lava_golem'){
    if(allOwnedMonsters(BOT).length<2){ toast("Your opponent needs at least 2 monsters to Tribute for Lava Golem."); return; }
    openLavaGolemTributeModal(card);
    return;
  }
  if(b.cat==='Monster'){
    if(G.players[ME].normalSummonUsed){ toast('Already used your Normal Summon this turn.'); return; }
    G.selection={type:'hand',uid:card.uid,mode:'monster'};
  } else {
    G.selection={type:'hand',uid:card.uid,mode:'spelltrap'};
  }
  render();
}
function onEmptyZoneClick(pIdx,type,idx){
  if(G.active!==ME || pIdx!==ME) return;
  if(!G.selection || G.selection.type!=='hand') return;
  const card=G.players[ME].hand.find(c=>c.uid===G.selection.uid);
  if(!card) return;
  const b=base(card);
  if(type==='mon' && G.selection.mode==='monster'){
    tryPlaceMonster(card,idx);
  } else if(type==='st' && G.selection.mode==='spelltrap'){
    if(b.cat==='Spell'){
      showModal(b.n,'How do you want to play this Spell Card?',[
        {label:'Activate',action:()=>placeSpell(card,idx,true)},
        {label:'Set Face-Down',action:()=>placeSpell(card,idx,false)},
      ]);
    } else {
      placeTrapSet(card,idx);
    }
  }
}
function isZonePlaceable(pIdx,type,idx){
  if(G.active!==ME||pIdx!==ME||!G.selection||G.selection.type!=='hand') return false;
  if(G.players[pIdx][type][idx]) return false;
  if(type==='mon') return G.selection.mode==='monster';
  if(type==='st') return G.selection.mode==='spelltrap';
  return false;
}
function isZoneTargetable(pIdx,type,idx){
  if(!G.selection) return false;
  if(G.selection.type==='attack' && G.selection.stage==='target'){
    if(type!=='mon') return false;
    if(G.selection.mode==='direct') return false;
    return pIdx===BOT && !!G.players[BOT].mon[idx];
  }
  return false;
}

function tryPlaceMonster(card,idx){
  const b=base(card);
  const need = b.l>=7?2:(b.l>=5?1:0);
  if(need>0){
    const owned=G.players[ME].mon.filter(m=>m).length;
    if(owned<need){ toast(`Level ${b.l} monster needs ${need} tribute${need>1?'s':''} — you only control ${owned}.`); return; }
    G.selection=null; render();
    openTributeModal(card,idx,need);
    return;
  }
  showModal(b.n,'Summon face-up (Attack Position) or Set face-down (Defense Position)?',[
    {label:'Normal Summon',action:()=>finishSummon(card,idx,false,[])},
    {label:'Set',action:()=>finishSummon(card,idx,true,[])},
  ]);
}
function openTributeModal(card,idx,need,tributeSide,onConfirm){
  if(tributeSide===undefined) tributeSide=ME;
  const owned=[];
  G.players[tributeSide].mon.forEach((m,i)=>{ if(m) owned.push(i); });
  const selected=new Set();
  const bg=document.createElement('div'); bg.className='modal-bg';
  const m=document.createElement('div'); m.className='modal';
  const head=document.createElement('h3'); head.textContent=`Tribute ${need} Monster${need>1?'s':''}`;
  const counter=document.createElement('p'); counter.className='hint';
  counter.textContent=`Choose ${need} of ${tributeSide===ME?'your':"your opponent's"} monsters to Tribute for ${base(card).n}. Tap the eye to view a card first.`;
  const status=document.createElement('p'); status.className='hint';
  const list=document.createElement('div'); list.className='card-list-rows';
  m.append(head,counter,list,status);

  function refresh(){
    status.textContent=`Selected ${selected.size} of ${need}.`;
    confirmBtn.classList.toggle('disabled',selected.size!==need);
  }
  owned.forEach(zi=>{
    const c=G.players[tributeSide].mon[zi];
    const d=base(c);
    const row=document.createElement('div'); row.className='card-list-row tribute-row';
    const check=document.createElement('span'); check.className='tribute-check'; check.textContent='⬜';
    const icon=document.createElement('span'); icon.className='clr-icon'; icon.textContent=c.faceDown?'🂠':d.em;
    const name=document.createElement('span'); name.className='clr-name'; name.textContent=c.faceDown?'Set Monster':d.n;
    const tag=document.createElement('span'); tag.className='clr-tag';
    tag.textContent=c.faceDown?'':`Lv${d.l} ${effAtk(c)}/${effDef(c)}`;
    const peek=document.createElement('button'); peek.type='button'; peek.className='mopt-peek'; peek.title='View card';
    peek.textContent='👁';
    peek.addEventListener('click',(e)=>{ e.stopPropagation(); showCardPopup(c,false); });
    row.append(check,icon,name,tag,peek);
    row.addEventListener('click',()=>{
      if(selected.has(zi)){
        selected.delete(zi); row.classList.remove('checked'); check.textContent='⬜';
      } else {
        if(selected.size>=need){ toast(`You can only Tribute ${need} monster${need>1?'s':''}.`); return; }
        selected.add(zi); row.classList.add('checked'); check.textContent='✅';
      }
      refresh();
    });
    list.appendChild(row);
  });

  const btnRow=document.createElement('div'); btnRow.className='mrow';
  const confirmBtn=document.createElement('div'); confirmBtn.className='mopt primary disabled';
  confirmBtn.innerHTML='<span class="mopt-label">Confirm Tribute</span>';
  confirmBtn.addEventListener('click',()=>{
    if(selected.size!==need) return;
    document.body.removeChild(bg);
    const tribs=[...selected];
    if(onConfirm){ onConfirm(tribs); return; }
    showModal(base(card).n,'Summon face-up (Attack Position) or Set face-down (Defense Position)?',[
      {label:'Tribute Summon',action:()=>finishSummon(card,idx,false,tribs)},
      {label:'Tribute Set',action:()=>finishSummon(card,idx,true,tribs)},
    ]);
  });
  const cancelBtn=document.createElement('div'); cancelBtn.className='mopt';
  cancelBtn.innerHTML='<span class="mopt-label">Cancel</span>';
  cancelBtn.addEventListener('click',()=>{ document.body.removeChild(bg); });
  btnRow.append(confirmBtn,cancelBtn);
  m.appendChild(btnRow);

  bg.appendChild(m); document.body.appendChild(bg);
  refresh();
}
function openLavaGolemTributeModal(card){
  openTributeModal(card,-1,2,BOT,(tribs)=>finishLavaGolemSummon(card,tribs));
}
function finishLavaGolemSummon(card,tributeIdxs){
  tributeIdxs.sort((a,b)=>b-a).forEach(i=>{
    const t=G.players[BOT].mon[i];
    sendToGY(BOT,t,'mon',i,'tribute');
    log(`Tributed ${base(t).n}.`,'me');
  });
  G.players[ME].hand=G.players[ME].hand.filter(c=>c.uid!==card.uid);
  const z=findEmptyZone(BOT,'mon');
  card.faceDown=false; card.pos='atk'; card.controller=BOT; card.zone=z;
  card.summonedTurn=G.turnNum; card.attacked=false; card.equips=[]; card.tempAtk=0;
  G.players[BOT].mon[z]=card;
  log(`You Special Summon Lava Golem to the Bot's field!`,'me');
  SFX.place(); markJustPlaced(card.uid);
  render();
  afterAnySummon(BOT,card,z,false,true);
}
function onZoneCardClick(pIdx,type,idx){
  if(G.selection && G.selection.type==='attack' && G.selection.stage==='target' && pIdx===BOT && type==='mon'){
    resolveAttack(G.selection.attackerIdx, idx);
    return;
  }
  // battle declare: click own attack-ready monster
  if(!G.selection && G.phase==='battle' && G.active===ME && pIdx===ME && type==='mon'){
    const card=G.players[ME].mon[idx];
    if(!card){return;}
    if(card.faceDown){ toast("Set monsters can't attack this turn."); return; }
    if(card.pos!=='atk'){ toast('Only Attack Position monsters can attack.'); return; }
    if(card.attacked){ toast('This monster already attacked.'); return; }
    if(card.summonedTurn===G.turnNum && !card.canRush){ /* allow: normal summon then attack same turn is standard */ }
    beginAttackDeclare(idx);
    return;
  }
  // main phase: click own face-up monster to change position / flip summon a set monster
  if(!G.selection && (G.phase==='main1'||G.phase==='main2') && G.active===ME && pIdx===ME && type==='mon'){
    const card=G.players[ME].mon[idx];
    if(!card) return;
    if(card.faceDown){
      showModal(base(card).n,'Flip Summon this Set monster face-up?',[
        {label:'Flip Summon',action:()=>flipSummon(ME,idx)},
        {label:'Cancel',action:()=>{}},
      ]);
      return;
    }
    const canChangePos=card.summonedTurn!==G.turnNum && !card.positionLocked;
    const eff=getActivatableMonsterEffect(card,ME,idx);
    const opts=[];
    if(canChangePos){
      const to=card.pos==='atk'?'def':'atk';
      opts.push({label:`Change to ${to==='atk'?'Attack':'Defense'} Position`,action:()=>{card.pos=to; log(`Changed ${base(card).n} to ${to==='atk'?'Attack':'Defense'} Position.`,'me'); render();}});
    }
    if(eff) opts.push({label:eff.label,action:eff.activate});
    if(!opts.length){
      toast(card.positionLocked?"This monster's Battle Position is locked.":"Can't change position the turn it was Summoned.");
      return;
    }
    opts.push({label:'Cancel',action:()=>{}});
    showModal(base(card).n,'Choose an action:',opts);
    return;
  }
  // activate a set spell/trap you control
  if(!G.selection && (G.phase==='main1'||G.phase==='main2') && G.active===ME && pIdx===ME && type==='st'){
    const card=G.players[ME].st[idx];
    if(!card||!card.faceDown) return;
    const b=base(card);
    if(b.cat==='Trap' && (b.sub==='Counter' || RESPONSE_ONLY_TRAP_FX.has(b.fx))){ toast('This Trap can only be activated in response to something.'); return; }
    if(b.cat==='Spell'){
      showModal(b.n,'Activate this Spell Card?',[
        {label:'Activate',action:()=>activateFromField(ME,idx,()=>offerDarkBribeResponse(ME,card,idx,()=>resolveSpellTrapEffect(ME,card,idx)))},
        {label:'Cancel',action:()=>{}},
      ]);
    } else {
      showModal(b.n,'Activate this Trap Card?',[
        {label:'Activate',action:()=>activateFromField(ME,idx,()=>offerDarkBribeResponse(ME,card,idx,()=>resolveSpellTrapEffect(ME,card,idx)))},
        {label:'Cancel',action:()=>{}},
      ]);
    }
  }
}
function finishSummon(card,idx,faceDown,tributeIdxs){
  tributeIdxs.sort((a,b)=>b-a).forEach(i=>{
    const t=G.players[ME].mon[i];
    sendToGY(ME,t,'mon',i,'tribute');
    log(`Tributed ${base(t).n}.`,'me');
  });
  G.players[ME].hand=G.players[ME].hand.filter(c=>c.uid!==card.uid);
  card.faceDown=faceDown; card.pos=faceDown?'def':'atk'; card.controller=ME; card.zone=idx;
  card.summonedTurn=G.turnNum; card.attacked=false; card.equips=[]; card.tempAtk=0;
  G.players[ME].mon[idx]=card;
  G.players[ME].normalSummonUsed=true;
  G.selection=null;
  log(`You ${faceDown?'Set':'Summoned'} ${faceDown?'a monster':base(card).n} in ${faceDown?'Defense':'Attack'} Position.`,'me');
  SFX.place(); markJustPlaced(card.uid);
  render();
  if(!faceDown) afterSummon(ME,card,idx);
  else afterAnySummon(ME,card,idx,true);
}
function placeSpell(card,idx,activate){
  G.players[ME].hand=G.players[ME].hand.filter(c=>c.uid!==card.uid);
  card.faceDown=!activate; card.controller=ME; card.zone=idx; card.summonedTurn=G.turnNum;
  G.players[ME].st[idx]=card;
  G.selection=null;
  markJustPlaced(card.uid);
  if(activate){ log(`You activated ${base(card).n}.`,'me'); SFX.activate(); render(); offerDarkBribeResponse(ME,card,idx,()=>resolveSpellTrapEffect(ME,card,idx)); }
  else { log(`You Set a Spell/Trap.`,'me'); SFX.place(); render(); }
}
function offerDarkBribeResponse(activatorSide,card,idx,onResolve){
  const opp=1-activatorSide;
  const oppP=G.players[opp];
  const eligible=[];
  oppP.st.forEach((c,i)=>{ if(c && c.faceDown && base(c).fx==='dark_bribe') eligible.push({i,c}); });
  if(!eligible.length){ onResolve(); return; }
  const activateBribe=(trapIdx,trapCard)=>{
    trapCard.faceDown=false;
    log(`${opp===ME?'You':'Bot'} activated ${base(trapCard).n}.`, opp===ME?'me':'opp');
    SFX.activate(); markJustPlaced(trapCard.uid);
    render();
    const trapEl=zoneCardEl(opp,'st',trapIdx), targetEl=zoneCardEl(activatorSide,'st',idx);
    const finish=()=>{
      log(`Dark Bribe negates ${base(card).n} and destroys it! ${activatorSide===ME?'You draw':'Bot draws'} a card.`, opp===ME?'me':'opp');
      if(G.players[activatorSide].st[idx]===card) sendToGY(activatorSide,card,'st',idx,'effect');
      drawCard(activatorSide);
      sendToGY(opp,trapCard,'st',trapIdx,'effect');
      render();
    };
    if(trapEl && targetEl){ playBeam(trapEl,targetEl,'trap'); setTimeout(finish,340); }
    else finish();
  };
  if(opp===ME){
    const pick=eligible[0];
    showModal('Activate a Trap?', `${activatorSide===ME?'You':'Bot'} activated ${base(card).n}. Respond with Dark Bribe?`, [
      {label:base(pick.c).n, card:pick.c, action:()=>activateBribe(pick.i,pick.c)},
      {label:'Pass', action:()=>onResolve()},
    ]);
  } else {
    activateBribe(eligible[0].i, eligible[0].c);
  }
}
function placeTrapSet(card,idx){
  G.players[ME].hand=G.players[ME].hand.filter(c=>c.uid!==card.uid);
  card.faceDown=true; card.controller=ME; card.zone=idx; card.summonedTurn=G.turnNum;
  G.players[ME].st[idx]=card;
  G.selection=null;
  log('You Set a Spell/Trap.','me');
  SFX.place(); markJustPlaced(card.uid);
  render();
}
function activateFromField(pIdx,idx,customResolve){
  const card=G.players[pIdx].st[idx];
  const b=base(card);
  card.faceDown=false;
  log(`${pIdx===ME?'You':'Bot'} activated ${b.n}.`, pIdx===ME?'me':'opp');
  SFX.activate(); markJustPlaced(card.uid);
  render();
  if(customResolve) customResolve();
  else resolveSpellTrapEffect(pIdx,card,idx);
}
function flipSummon(pIdx,idx){
  const card=G.players[pIdx].mon[idx];
  card.faceDown=false; card.pos='atk';
  log(`${pIdx===ME?'You':'Bot'} Flip Summoned ${base(card).n}.`, pIdx===ME?'me':'opp');
  SFX.place(); markJustPlaced(card.uid);
  render();
  triggerFlip(pIdx,card,idx);
  afterAnySummon(pIdx,card,idx,true);
}
function afterSummon(pIdx,card,idx){
  const fx=base(card).fx;
  if(fx==='jerry_beans_man'){ drawCard(pIdx); if(G.players[pIdx].hand.length){ const disc=G.players[pIdx].hand[0]; G.players[pIdx].hand.shift(); G.gy.push(disc); log(`${pIdx===ME?'You':'Bot'} drew then discarded a card (Jerry Beans Man).`,pIdx===ME?'me':'opp'); render(); } }
  if(fx==='hunter_dragon'){
    const opp=1-pIdx;
    const targets=[]; G.players[opp].mon.forEach((m,i)=>{ if(m && !m.faceDown && m.pos==='def' && !m.unaffectedByEffects) targets.push(i); });
    if(targets.length){
      if(pIdx===ME){
        showModal('Hunter Dragon','Destroy a face-up Defense Position monster?',
          targets.map(i=>({label:base(G.players[opp].mon[i]).n,action:()=>{ log(`Hunter Dragon destroys ${base(G.players[opp].mon[i]).n}.`,'me'); sendToGY(opp,G.players[opp].mon[i],'mon',i,'effect'); render();}})).concat([{label:'Skip',action:()=>{}}]));
      } else {
        const i=targets[0]; log(`Bot's Hunter Dragon destroys ${base(G.players[opp].mon[i]).n}.`,'opp'); sendToGY(opp,G.players[opp].mon[i],'mon',i,'effect'); render();
      }
    }
  }
  afterAnySummon(pIdx,card,idx,false);
}
function afterAnySummon(pIdx,card,idx,wasSetOrFlip,isSpecial){
  // Princess of Tsurugi triggers on Normal/Flip Summons only (controlled by the opponent of the summoner)
  const opp=1-pIdx;
  if(!isSpecial){
    const pt=G.players[opp].mon.find(m=>m && !m.faceDown && base(m).fx==='princess_of_tsurugi');
    if(pt){ dealDamage(pIdx,500); log(`Princess of Tsurugi inflicts 500 damage.`, pIdx===ME?'opp':'me'); }
  }
  // Trap window: Trap Hole / Torrential Tribute / Floodgate Trap Hole / Horn of Heaven controlled by the opponent
  openSummonTrapWindow(pIdx,card,idx,!!isSpecial);
}
function openSummonTrapWindow(summonerIdx,card,idx,isSpecial){
  const opp=1-summonerIdx;
  const oppP=G.players[opp];
  const eligible=[];
  oppP.st.forEach((c,i)=>{
    if(c && c.faceDown){
      const fx=base(c).fx;
      if(fx==='trap_hole' && !isSpecial && effAtk(card)>=1500) eligible.push({i,c,fx});
      else if(fx==='torrential_tribute') eligible.push({i,c,fx});
      else if(fx==='floodgate_trap_hole') eligible.push({i,c,fx});
      else if(fx==='horn_of_heaven' && isSpecial) eligible.push({i,c,fx});
    }
  });
  if(!eligible.length) return;
  if(opp===ME){
    const opts=eligible.map(e=>({label:base(e.c).n,card:e.c,action:()=>{ resolveSummonTrap(ME,e.i,e.c,e.fx,summonerIdx,card,idx); }}));
    opts.push({label:'Pass',action:()=>{}});
    showModal('Activate a Trap?', `${summonerIdx===ME?'You':'Bot'} Summoned ${base(card).n}.`, opts);
  } else {
    // simple bot heuristic: always trigger if available
    const pick=eligible[0];
    resolveSummonTrap(BOT,pick.i,pick.c,pick.fx,summonerIdx,card,idx);
  }
}
function resolveSummonTrap(defenderIdx,trapIdx,trapCard,fx,summonerIdx,summonedCard,summonedIdx){
  trapCard.faceDown=false;
  log(`${defenderIdx===ME?'You':'Bot'} activated ${base(trapCard).n}.`, defenderIdx===ME?'me':'opp');
  SFX.activate(); markJustPlaced(trapCard.uid);
  render();
  const trapEl=zoneCardEl(defenderIdx,'st',trapIdx);
  const finish=()=>{
    if(fx==='trap_hole'){
      log(`Trap Hole destroys ${base(summonedCard).n}.`, defenderIdx===ME?'me':'opp');
      sendToGY(summonerIdx,summonedCard,'mon',summonedIdx,'effect');
    } else if(fx==='torrential_tribute'){
      [ME,BOT].forEach(s=>{ G.players[s].mon.forEach((m,i)=>{ if(m) sendToGY(s,m,'mon',i,'effect'); }); });
      log('Torrential Tribute destroys all monsters on the field.','sys');
    } else if(fx==='floodgate_trap_hole'){
      if(G.players[summonerIdx].mon[summonedIdx]===summonedCard){
        summonedCard.pos='def'; summonedCard.faceDown=false; summonedCard.positionLocked=true;
        log(`Floodgate Trap Hole flips ${base(summonedCard).n} face-up and locks it in Defense Position.`, defenderIdx===ME?'me':'opp');
      }
    } else if(fx==='horn_of_heaven'){
      log(`Horn of Heaven negates the Special Summon and destroys ${base(summonedCard).n}!`, defenderIdx===ME?'me':'opp');

function openAttackTrapWindow(attackerSide,defenderSide,attacker,atkIdx,targetIdx,cb){
  const defP=G.players[defenderSide];
  const eligible=[];
  defP.st.forEach((c,i)=>{
    if(c && c.faceDown){
      const fx=base(c).fx;
      if(['magic_cylinder','draining_shield','dimensional_prison','waboku','solemn_judgment'].includes(fx)) eligible.push({i,c,fx});
    }
  });
  const mirage=defP.mon.find(m=>m && !m.faceDown && base(m).fx==='mirage_dragon');
  const kuriboh=!G.noBattleDamage[defenderSide] ? defP.hand.find(c=>base(c).fx==='kuriboh') : null;

    G.noBattleDamage[defenderSide]=true;
    log(`${defenderSide===ME?'You discard':'Bot discards'} Kuriboh to negate Battle Damage this turn!`, defenderSide===ME?'me':'opp');
    render();

  };

    const opts=eligible.map(e=>({label:base(e.c).n,card:e.c,action:()=>{ activateFromField(ME,e.i); resolveTrapVsAttack(e.fx,attackerSide,defenderSide,attacker,atkIdx,targetIdx,cb,defenderSide,e.i); }}));
    if(mirage) opts.push({label:'Negate with Mirage Dragon',card:mirage,action:()=>{ log('Mirage Dragon negates the attack!','me'); const mEl=zoneCardEl(defenderSide,'mon',defP.mon.indexOf(mirage)),aEl=zoneCardEl(attackerSide,'mon',atkIdx); if(mEl&&aEl) playBeam(mEl,aEl,'trap'); cb(true); }});
    if(kuriboh) opts.push({label:'Discard Kuriboh',card:kuriboh,action:useKuriboh});
    if(opts.length===0){ cb(false); return; }
    opts.push({label:'Take the hit',action:()=>cb(false)});
    showModal('Incoming Attack!', `${base(attacker).n} (ATK ${effAtk(attacker)}) is attacking. Respond?`, opts);
  } else {
    // bot defending
    if(mirage && Math.random()<0.6){ log("Bot's Mirage Dragon negates the attack!",'opp'); const mEl=zoneCardEl(defenderSide,'mon',defP.mon.indexOf(mirage)),aEl=zoneCardEl(attackerSide,'mon',atkIdx); if(mEl&&aEl) playBeam(mEl,aEl,'trap'); cb(true); return; }
    if(eligible.length){
      const pick=eligible[Math.floor(Math.random()*eligible.length)];
      activateFromField(BOT,pick.i);
      resolveTrapVsAttack(pick.fx,attackerSide,defenderSide,attacker,atkIdx,targetIdx,cb,defenderSide,pick.i);
    } else if(kuriboh){ useKuriboh(); }
    else cb(false);
  }
}
function resolveTrapVsAttack(fx,attackerSide,defenderSide,attacker,atkIdx,targetIdx,cb,trapSide,trapIdx){
  const trapEl = trapSide!==undefined ? zoneCardEl(trapSide,'st',trapIdx) : null;
  const atkEl = zoneCardEl(attackerSide,'mon',atkIdx);
  const trapCard = trapSide!==undefined ? G.players[trapSide].st[trapIdx] : null;
  function trapToGY(){ if(trapCard){ sendToGY(trapSide,trapCard,'st',trapIdx,'effect'); render(); } }
  if(trapEl && atkEl && ['magic_cylinder','draining_shield','dimensional_prison','solemn_judgment'].includes(fx)) playBeam(trapEl,atkEl,'trap');
  if(fx==='magic_cylinder'){ dealDamage(attackerSide,effAtk(attacker)); log(`Magic Cylinder reflects ${effAtk(attacker)} damage!`, defenderSide===ME?'me':'opp'); trapToGY(); cb(true); }
  else if(fx==='draining_shield'){ gainHealth(defenderSide,effAtk(attacker)); log(`Draining Shield gains ${effAtk(attacker)} Health!`, defenderSide===ME?'me':'opp'); trapToGY(); cb(true); }
  else if(fx==='dimensional_prison'){ banish(attackerSide,attacker,'mon',atkIdx); log(`Dimensional Prison banishes ${base(attacker).n}!`, defenderSide===ME?'me':'opp'); trapToGY(); cb(true); }
  else if(fx==='waboku'){ G.waboku=defenderSide; log(`Waboku will prevent battle damage and destruction this turn.`, defenderSide===ME?'me':'opp'); trapToGY(); cb(false); }
  else if(fx==='solemn_judgment'){
    G.health[defenderSide]=Math.floor(G.health[defenderSide]/2);
    sendToGY(attackerSide,attacker,'mon',atkIdx,'effect');
    log(`Solemn Judgment negates the attack and destroys ${base(attacker).n}! Half Health paid.`, defenderSide===ME?'me':'opp');
    trapToGY();
    cb(true);
  }
  else cb(false);
}
function grantExtraAttackIfEligible(attacker){
  if(base(attacker).fx==='great_white' && attacker.usedGreatWhite!==G.turnNum){
    attacker.usedGreatWhite=G.turnNum;
    attacker.attacked=false;
    log(`${base(attacker).n} destroyed a monster — it can attack again!`, attacker.controller===ME?'me':'opp');
  }
}
function performBattle(attackerSide,defenderSide,atkIdx,targetIdx){
  const attacker=G.players[attackerSide].mon[atkIdx];
  if(!attacker){ render(); return; }
  if(targetIdx===-1){
    const blocked=G.waboku===defenderSide||G.noBattleDamage[defenderSide];
    if(G.waboku===defenderSide){ log('Waboku prevents the Battle Damage.', defenderSide===ME?'me':'opp'); }
    else dealDamage(defenderSide, effAtk(attacker), true);
    log(`Direct attack deals ${blocked?0:effAtk(attacker)} damage!`, attackerSide===ME?'me':'opp');
    render(); return;
  }
  const defender=G.players[defenderSide].mon[targetIdx];
  if(!defender){ render(); return; }
  const wasFaceDown=defender.faceDown;
  if(wasFaceDown){
    defender.faceDown=false;
    log(`${base(defender).n} is flipped face-up!`, defenderSide===ME?'me':'opp');
    render();
    triggerFlip(defenderSide,defender,targetIdx);
  }
  const aAtk=effAtk(attacker);
  if(defender.pos==='atk'){
    const dAtk=effAtk(defender);
    if(aAtk>dAtk){
      const dmg=aAtk-dAtk;
      const blocked=G.waboku===defenderSide||G.noBattleDamage[defenderSide];
      protectedDestroy(defenderSide,defender,targetIdx);
      if(G.waboku!==defenderSide) dealDamage(defenderSide,dmg,true);
      log(`${base(attacker).n} destroys ${base(defender).n}! ${blocked?0:dmg} damage.`,attackerSide===ME?'me':'opp');
      grantExtraAttackIfEligible(attacker);
    } else if(aAtk<dAtk){
      const dmg=dAtk-aAtk;
      const blocked=G.noBattleDamage[attackerSide];
      protectedDestroy(attackerSide,attacker,atkIdx);
      dealDamage(attackerSide,dmg,true);
      log(`${base(defender).n} destroys ${base(attacker).n}! ${blocked?0:dmg} damage.`,attackerSide===ME?'me':'opp');
    } else {
      protectedDestroy(attackerSide,attacker,atkIdx);
      protectedDestroy(defenderSide,defender,targetIdx);
      log(`Both monsters destroy each other!`,'sys');
    }
  } else {
    const dDef=effDef(defender);
    if(aAtk>dDef){
      protectedDestroy(defenderSide,defender,targetIdx);
      log(`${base(attacker).n} destroys ${base(defender).n} (Defense Position). No Battle Damage.`,attackerSide===ME?'me':'opp');
      grantExtraAttackIfEligible(attacker);
    } else if(aAtk<dDef){
      const dmg=dDef-aAtk;
      const blocked=G.noBattleDamage[attackerSide];
      dealDamage(attackerSide,dmg,true);
      log(`${base(defender).n} withstands the attack! You take ${blocked?0:dmg} damage.`,attackerSide===ME?'me':'opp');
    } else {
      log(`Attack bounces off ${base(defender).n} — no effect.`,'sys');
    }
  }
  render();
}
function protectedDestroy(side,card,idx){
  if(G.waboku===side){ log(`Waboku protects ${base(card).n} from destruction.`, side===ME?'me':'opp'); return; }
  sendToGY(side,card,'mon',idx,'battle');
}
